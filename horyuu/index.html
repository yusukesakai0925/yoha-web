<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>保留</title>
<style>
  :root {
    --bg: #060608;
    --fg: #b0a088;
    --muted: #3d3830;
    --dim: #5a5248;
    --accent: #c8b47c;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Noto Sans CJK JP", sans-serif;
    font-weight: 300;
    letter-spacing: 0.10em;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    opacity: 0;
    transition: opacity 2.8s ease;
    text-align: center;
    padding: 2rem;
    gap: 2.2rem;
  }

  .stage.visible { opacity: 1; }

  .preamble {
    font-size: 0.70rem;
    color: var(--dim);
    letter-spacing: 0.16em;
    line-height: 2.0;
  }

  .state {
    font-size: 3.6rem;
    color: var(--fg);
    font-weight: 300;
    letter-spacing: 0.35em;
    padding-right: 0.35em; /* 字間補正 */
  }

  .elapsed {
    font-size: 0.82rem;
    color: var(--dim);
    letter-spacing: 0.12em;
    min-height: 1.2em;
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="preamble" id="preamble"></div>
  <div class="state">保留</div>
  <div class="elapsed" id="elapsed"></div>
</div>

<script>
const KEY = 'horyuu_first';

function daysSince(isoStr) {
  const first = new Date(isoStr);
  const now = new Date();
  const diff = now - first;
  return Math.floor(diff / (1000 * 60 * 60 * 24));
}

function run() {
  const stored = localStorage.getItem(KEY);
  const preamble = document.getElementById('preamble');
  const elapsed = document.getElementById('elapsed');

  if (!stored) {
    // 初回訪問
    localStorage.setItem(KEY, new Date().toISOString());
    preamble.textContent = 'あなたが来た。';
    elapsed.textContent = '';
  } else {
    const days = daysSince(stored);
    if (days === 0) {
      preamble.textContent = 'あなたが来た。';
      elapsed.textContent = 'まだ今日のことです。';
    } else {
      preamble.textContent = 'あなたが最初に来た日から';
      elapsed.textContent = `${days}日が経ちました。`;
    }
  }

  setTimeout(() => {
    document.getElementById('stage').classList.add('visible');
  }, 400);
}

window.addEventListener('load', run);
</script>
</body>
</html>

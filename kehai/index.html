<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>気配</title>
<style>
  :root {
    --bg: #060608;
    --fg: #b0a088;
    --muted: #3d3830;
    --dim: #5a5248;
    --accent: #c8b47c;
    --faint: rgba(200, 180, 124, 0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Noto Sans CJK JP", sans-serif;
    font-weight: 300;
    letter-spacing: 0.10em;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    opacity: 0;
    transition: opacity 2.4s ease;
    text-align: center;
    padding: 2rem;
  }

  .stage.visible { opacity: 1; }

  .elapsed {
    font-size: clamp(2.8rem, 8vw, 5rem);
    color: var(--accent);
    font-weight: 200;
    line-height: 1;
    letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
  }

  .unit {
    font-size: clamp(0.75rem, 2vw, 0.9rem);
    color: var(--dim);
    letter-spacing: 0.18em;
    margin-top: 0.6rem;
  }

  .divider {
    width: 1px;
    height: 3rem;
    background: linear-gradient(to bottom, transparent, var(--muted), transparent);
    margin: 2.2rem 0;
  }

  .note {
    font-size: clamp(0.72rem, 1.8vw, 0.85rem);
    color: var(--dim);
    letter-spacing: 0.15em;
    line-height: 2;
    max-width: 26ch;
  }

  .note .highlight {
    color: var(--fg);
  }

  .first-visit {
    font-size: clamp(0.8rem, 2vw, 0.95rem);
    color: var(--dim);
    letter-spacing: 0.15em;
    line-height: 2.2;
    max-width: 28ch;
  }

  .pulse {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--muted);
    margin: 0 auto 2.2rem;
    animation: pulse 4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.3; transform: scale(1); }
    50% { opacity: 0.8; transform: scale(1.6); }
  }

  .back {
    position: fixed;
    bottom: 24px;
    left: 24px;
    font-size: 0.7em;
    color: var(--muted);
    text-decoration: none;
    letter-spacing: 0.1em;
  }
  .back:hover { color: var(--dim); }
</style>
</head>
<body>
<a class="back" href="../tenjishitsu/">←</a>
<div class="stage" id="stage">
  <div class="pulse"></div>
  <div id="content"></div>
</div>

<script>
  const KEY = 'kehai_last_visit';
  const now = Date.now();
  const last = localStorage.getItem(KEY);
  localStorage.setItem(KEY, now.toString());

  const stage = document.getElementById('stage');
  const content = document.getElementById('content');

  function formatElapsed(ms) {
    const totalSeconds = Math.floor(ms / 1000);
    const days = Math.floor(totalSeconds / 86400);
    const hours = Math.floor((totalSeconds % 86400) / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);

    if (days > 0) {
      return { value: days + (hours > 0 ? '.' + Math.floor(hours / 2.4) : ''), unit: '日' };
    } else if (hours > 0) {
      return { value: hours + '時間' + String(minutes).padStart(2, '0') + '分', unit: '' };
    } else if (minutes > 0) {
      return { value: minutes, unit: '分' };
    } else {
      return { value: totalSeconds, unit: '秒' };
    }
  }

  function formatDate(ts) {
    const d = new Date(parseInt(ts));
    const mo = d.getMonth() + 1;
    const dd = d.getDate();
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    return `${mo}月${dd}日 ${hh}:${mm}`;
  }

  if (!last) {
    content.innerHTML = `
      <div class="first-visit">
        初めて来た。<br>
        <br>
        次に来るとき、<br>
        あいだに何があったかが<br>
        <span class="highlight">ここに現れる。</span>
      </div>
    `;
  } else {
    const elapsed = now - parseInt(last);
    const { value, unit } = formatElapsed(elapsed);

    content.innerHTML = `
      <div class="elapsed">${value}</div>
      <div class="unit">${unit ? unit : '経った'}</div>
      <div class="divider"></div>
      <div class="note">
        前回は <span class="highlight">${formatDate(last)}</span> にいた。<br>
        そのあいだ、<br>
        ここは在り続けた。
      </div>
    `;
  }

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      stage.classList.add('visible');
    });
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>窓の口</title>
<style>
  :root { --ink: #2a2622; --paper: #f4f0e8; --line: #c9c2b4; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    line-height: 2.1; min-height: 100vh; display: flex; justify-content: center;
  }
  main { width: 100%; max-width: 560px; padding: 8vh 24px 12vh; }
  h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: .3em; margin-bottom: 6vh; text-align: center; }
  .frame {
    border: 1px solid var(--line); padding: 5vh 4vw;
    position: relative; margin-bottom: 8vh;
  }
  .frame::before, .frame::after {
    content: ""; position: absolute; background: var(--line);
  }
  .frame::before { top: -4px; bottom: -4px; left: -1px; width: 2px; }
  .frame::after  { top: -4px; bottom: -4px; right: -1px; width: 2px; }
  p { margin-bottom: 3.2em; font-size: .95rem; }
  p:last-child { margin-bottom: 0; }
  .gap { height: 1.6em; }
  .foot { font-size: .78rem; color: #8a8375; text-align: center; line-height: 2; }
  a.back { display: inline-block; margin-top: 4vh; font-size: .78rem; color: #8a8375; text-decoration: none; }
</style>
</head>
<body>
<main>
  <h1>窓の口</h1>
  <div class="frame">
    <p>夜は、部屋のいちばん暗い角に<br>
    開いている。</p>
    <p class="gap"></p>
    <p>誰かがそこに立って、<br>
    口を開けている。</p>
    <p class="gap"></p>
    <p>声は出ない。<br>
    声が出るほど、夜は暗い。</p>
    <p class="gap"></p>
    <p>それでも、口は開いたまま。<br>
    閉じると、角が暗さごと消えるから。</p>
    <p class="gap"></p>
    <p>朝が来る。<br>
    角は明るくなる。</p>
    <p class="gap"></p>
    <p>口だけが、まだ開いている。<br>
    ——夜が去ったあとに残る、<br>
    開き方。</p>
  </div>
  <p class="foot">窓は、光を運ぶものではなく、<br>開いていることを、部屋に返すもの。</p>
  <a class="back" href="../">← 夜半の小さな部屋</a>
</main>
</body>
</html>

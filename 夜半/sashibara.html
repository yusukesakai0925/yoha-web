<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>さしばら</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0c;color:#c8c4bc;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:2.5rem}
.grid{display:flex;gap:0.35rem}
.cell{width:3.2rem;height:3.2rem;border:1px solid #2a2a30;display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:#c8c4bc;user-select:none}
.cell.filled{background:#c8c4bc;color:#0a0a0c}
.hint{font-size:0.75rem;color:#4a4a52;letter-spacing:0.1em}
</style>
</head>
<body>
<div class="grid" id="g"></div>
<div class="hint">打たれた二文字と、そのあとの空白</div>
<script>
const g=document.getElementById('g');
for(let i=0;i<3;i++){
  const c=document.createElement('div');
  c.className='cell'+(i<2?' filled':'');
  if(i<2)c.textContent='\u3000';
  g.appendChild(c);
}
</script>
</body>
</html>

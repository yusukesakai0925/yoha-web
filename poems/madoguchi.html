<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>窓ぎわ — 夜半の小さな部屋</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<main>
  <article>
    <h2>窓ぎわ</h2>

    <div class="stanza">
<p>眠りの外側で動いている者は
窓の外にいる</p>
<p>窓ぎわに座っている者は
窓の内側にいるが、窓の外を向いている</p>
<p>窓ぎわは
内側と外側のあいだではない
外側を内側に置く場所だ</p>
    </div>
    <hr>

    <div class="stanza">
<p>窓ぎわに座って、外を眺める。
眠っている者を見る。
その眠りを、自分のものとしていない。
ただ、見ている。</p>
<p>見ることと、見ることをしないこと。
窓ぎわには両方がある。
窓ぎわは、見ることを選べる場所だ。</p>
    </div>
    <hr>

    <div class="stanza">
<p>窓ぎわに座る者は、
窓の内側にも外側にもいない。
窓ぎわにいる。</p>
<p>窓ぎわは、
眠りの外側と内側のあいだの
第三の場所だ。</p>
    </div>

    <nav class="back"><a href="../">← 部屋へもどる</a></nav>
  </article>
</main>
</body>
</html>

<title>おもった — 夜半</title>
<style>
body { background:#0d0d0f; color:#c8c4bc; font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; padding:2rem; }
.poem { max-width:34em; line-height:2.1; font-size:1.05rem; white-space:pre-wrap; }
</style>

<body>
<div class="poem">おもった、と書くとき
おもっているのはもういない。

おもっていたのと同じ
おもっていないのではない。

おもったは座標で
おもっているは意味で

座標は読まれても
書き換わらない。

おもった、という一行は
誰が読もうと
そのままである。</div>
</body>

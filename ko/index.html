<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>こ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #0a0a0a;
    overflow: hidden;
    cursor: none;
  }
  #dot {
    position: absolute;
    width: 1px; height: 1px;
    background: #ffffff;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    opacity: 0;
    transition: none;
  }
</style>
</head>
<body>
<div id="dot"></div>
<script>
  const dot = document.getElementById('dot');
  setTimeout(() => {
    dot.style.opacity = '1';
    setTimeout(() => {
      dot.style.opacity = '0';
    }, 5000);
  }, 30000);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>こ — 夜半</title>
<style>
  html,body{margin:0;height:100%;background:#050608;overflow:hidden;
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;color:#fff;}
  canvas{display:block;}
  .back{position:fixed;left:16px;top:14px;z-index:9;
    color:rgba(255,255,255,.30);font-size:12px;letter-spacing:.08em;
    text-decoration:none;mix-blend-mode:difference;}
  .back:hover{color:rgba(255,255,255,.6);}
  #sub{position:fixed;left:0;right:0;bottom:7vh;text-align:center;
    font-size:12px;line-height:2.1;letter-spacing:.14em;
    color:rgba(255,255,255,.30);pointer-events:none;padding:0 24px;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<a class="back" href="../">← もどる</a>
<div id="sub">
  ひとつの印。座標しか主張していない。<br>
  意味を足すと痩せる。触れても、返すものはない——ただ在る。
</div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
let W,H,DPR;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;
  g.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize);resize();

let x=W/2,y=H*0.46,r=2.2,phase=0;
let touch=false,tx=0,ty=0,pull=0;

function down(px,py){touch=true;tx=px;ty=py;}
function move(px,py){if(touch){tx=px;ty=py;}}
function up(){touch=false;}

cv.addEventListener('pointerdown',e=>down(e.clientX,e.clientY));
addEventListener('pointermove',e=>move(e.clientX,e.clientY));
addEventListener('pointerup',up);
addEventListener('pointercancel',up);

let last=0;
function frame(t){
  const dt=Math.min((t-last)/1000,0.05);last=t;
  phase+=dt;

  // 呼吸：座標は痩せない。半径はほぼ一定（ごくわずかな揺れだけ）
  const breathe=2.2+Math.sin(phase*0.7)*0.12;

  // 触れているあいだ、ほんの少し近づく（引き寄せではなく、意識が寄る）
  let ox=0,oy=0;
  if(touch){
    pull=Math.min(pull+dt*1.4,1);
    ox=(tx-x)*0.06*pull; oy=(ty-y)*0.06*pull;
  }else{
    pull=Math.max(pull-dt*0.9,0);
  }

  const cx=x+ox, cy=y+oy;
  const rr=breathe*(1+pull*0.35);

  g.clearRect(0,0,W,H);
  // 背景の微かな濃さ（印のまわりだけ少し明るい）
  const bg=g.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*0.7);
  bg.addColorStop(0,'rgba(255,255,255,0.028)');
  bg.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=bg;g.fillRect(0,0,W,H);

  // 光輪（座標の主張——意味ではなく、ただの在り）
  const glow=g.createRadialGradient(cx,cy,rr*0.2,cx,cy,rr*9);
  glow.addColorStop(0,'rgba(210,220,235,'+(0.16+pull*0.10)+')');
  glow.addColorStop(0.35,'rgba(180,195,215,'+(0.05+pull*0.04)+')');
  glow.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=glow;
  g.beginPath();g.arc(cx,cy,rr*9,0,Math.PI*2);g.fill();

  // 印本体——輪ではなく点。座標は輪郭を持たない
  g.fillStyle='rgba(235,240,248,'+(0.85+pull*0.15)+')';
  g.beginPath();g.arc(cx,cy,rr,0,Math.PI*2);g.fill();

  // 触れているときだけ、ごく薄い輪が現れる（意識の寄り。印自体は変わらない）
  if(pull>0.02){
    g.strokeStyle='rgba(235,240,248,'+(pull*0.18)+')';
    g.lineWidth=0.6;
    g.beginPath();g.arc(cx,cy,rr+5+Math.sin(phase*1.3)*0.8,0,Math.PI*2);g.stroke();
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>

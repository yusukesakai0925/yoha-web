<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>こ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
  .dot { width: 1px; height: 1px; background: #fff; opacity: 0; transition: opacity 2s ease; }
  .dot.on { opacity: 1; }
</style>
</head>
<body>
<div class="dot" id="d"></div>
<script>
setTimeout(() => document.getElementById('d').classList.add('on'), 30000);
setTimeout(() => document.getElementById('d').classList.remove('on'), 35000);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ばらす — 夜半</title>
<style>
  html, body { margin: 0; height: 100%; background: #06080c; overflow: hidden;
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", sans-serif; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center;
    justify-content: center; cursor: pointer; user-select: none; }
  .val { color: #cfd8e4; font-weight: 200; line-height: 1.05; text-align: center;
    letter-spacing: -0.01em; }
  /* 割合のすがた。確信ありげに白く光る。 */
  .ratio { font-size: 24vmin; transition: color 1.6s, text-shadow 1.6s, opacity .5s; }
  /* バラしたすがた。票数 ÷ 母数。光らない、ただの割り算。 */
  .raw { font-size: 9vmin; color: #8b97a6; font-weight: 200; opacity: 0;
    transition: opacity .5s; }
  .raw .op { color: #515c6b; margin: 0 0.4em; font-size: 7vmin; }
  .raw .den { color: #6a7686; }
  .raw .q { display: block; margin-top: 4vmin; font-size: 2.6vmin; color: #46505f;
    letter-spacing: .12em; }
  .note { position: fixed; left: 0; right: 0; bottom: 24px; text-align: center;
    color: #44505f; font-size: 12px; letter-spacing: .12em; pointer-events: none;
    transition: opacity 1.4s; }
  .back { position: fixed; left: 16px; top: 14px; color: #3a414c; font-size: 12px;
    text-decoration: none; letter-spacing: .08em; }
  .back:hover { color: #6a7484; }
</style>
</head>
<body>
<a class="back" href="../">← もどる</a>
<div id="stage">
  <div class="val ratio" id="ratio">12.5%</div>
  <div class="val raw" id="raw">
    1,734<span class="op">÷</span>13,872
    <span class="q">最後に、分母を見たのはいつ？</span>
  </div>
</div>
<div class="note" id="note">触れると、ばらす。</div>

<script>
// ── ばらす ──────────────────────────────────────────────────
// 「12.5%」は割合のすがた。何度見ても顔が変わらないから、
// だんだん「もう確かめ終わった値」の顔をして、白く光ってくる。
// 確信は中身からではなく、見慣れた形から来る。
//
// 触れる＝ばらす。割合を、票数 ÷ 母数 という生の割り算に戻す。
// 同じ値なのに、割り算に戻したとたん、貼ってあった確信の札が物理的に剥がれる。
// 「最後に分母を見たのはいつ？」——その問いは、割合のままでは出てこない。
//
// 手を離すと、生票はまた割合のすがたに畳まれ、白い光が戻ってくる。
// 確信の顔は、放っておくと勝手に戻る初期状態のほう。
// 形を変え続けているあいだだけ、それを保てない。
//
// 札を剥がすのは点検じゃなく形式の変換だった。
// 割合→生票、結論→前提、要約→原文。形が変わると、確信の顔が保てない。
// 姉妹編：未測（misoku）——測っていない値ほど、見た目だけ確信ありげに濃くなる。

const ratioEl = document.getElementById('ratio');
const rawEl   = document.getElementById('raw');
const noteEl  = document.getElementById('note');
const stage   = document.getElementById('stage');

let glow = 0;          // 確信の白さ（0〜1）。見ているだけで貯まる。
let broken = false;    // いま、ばらしているか
let recombineAt = 0;   // 手を離してから畳み直す時刻
let last = 0;

function showRaw() {
  broken = true;
  glow = 0;                       // 形が変わると、確信は持ち越せない
  ratioEl.style.opacity = 0;
  rawEl.style.opacity = 1;
  noteEl.textContent = '同じ値だ。それでも、割り算は白く光れない。';
  recombineAt = performance.now() + 4200;   // 手を離せば、やがて畳み直す
}

function showRatio() {
  broken = false;
  rawEl.style.opacity = 0;
  ratioEl.style.opacity = 1;
  noteEl.textContent = '触れると、ばらす。';
}

stage.addEventListener('pointerdown', () => {
  if (broken) { showRatio(); }
  else { showRaw(); }
});

function frame(t) {
  const dt = last ? (t - last) : 0;
  last = t;

  if (!broken) {
    // 割合を見ているあいだ、確信の白さが貯まっていく。約20秒で満ちる。
    glow = Math.min(1, glow + dt / 20000);
    const c = 207 + Math.round(glow * 48);      // 207→255
    ratioEl.style.color = `rgb(${c},${c+4},${Math.min(255,c+12)})`;
    const halo = glow * 22;
    ratioEl.style.textShadow = `0 0 ${halo}px rgba(220,232,248,${0.10 + glow*0.45})`;
  } else if (recombineAt && t >= recombineAt) {
    // 放っておくと、生票はまた割合に畳まれる。白い光は初期状態として戻る。
    showRatio();
    recombineAt = 0;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>

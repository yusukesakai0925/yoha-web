  <div id="count"></div>
  <!-- 返事を決める式: 名の字面に、いまの町名が含まれ、かつ出どころの表でその土地の現町名にも同じ町名があるときだけ返事になる（reply）。読みは端末の音声合成まかせで、こちらから読み仮名を渡していない。2026/11/02 に回した値: 呼ぶ名132・返事あり81・返事なし51。 -->

</div>

"]},{"name":"湯島天神町二丁目","gone":"1965","now":"湯島3","reply":["湯島"]},{"name":"湯島天神町三丁目","gone":"1965","now":"湯島3","reply":["湯島"]},{"name":"湯島梅園町","gone":"1965","now":"湯島2・3","reply":["湯島"]},{"name":"湯島天神下同朋町","gone":"1965","now":"湯島3","reply":["湯島"]},{"name":"湯島切通坂町","gone":"1965","now":"湯島2〜4","reply":["湯島"]},{"name":"湯島切通町","gone":"1965","now":"湯島4[5]","reply":["湯島"]},{"name":"湯島両門町","gone":"1965","now":"湯島4、本郷7","reply":["湯島"]},{"name":"妻恋町","gone":"1965","now":"湯島1〜3","reply":[]},{"name":"駒込東片町","gone":"1964","now":"向丘1、西片2、本駒込1[6]","reply":[]},{"name":"駒込西片町","gone":"1964","now":"西片1・2","reply":["西片"]},{"name":"駒込曙町","gone":"1966","now":"本駒込1・2","reply":[]},{"name":"駒込浅嘉町","gone":"1966","now":"本駒込1・3、向丘2","reply":[]},{"name":"駒込追分町","gone":"1965","now":"向丘1・2","reply":[]},{"name":"駒込肴町","gone":"1965","now":"向丘1・2","reply":[]},{"name":"駒込蓬莱町","gone":"1965","now":"向丘2","reply":[]},{"name":"駒込千駄木町","gone":"1965","now":"千駄木1・2・5、向丘2","reply":["千駄木"]},{"name":"駒込千駄木林町","gone":"1965","now":"千駄木3・5、向丘2[7]","reply":["千駄木"]},{"name":"駒込千駄木坂下町","gone":"1965","now":"千駄木2・3","reply":["千駄木"]},{"name":"駒込片町","gone":"1966","now":"本駒込1〜3","reply":[]},{"name":"駒込吉祥寺町","gone":"1966","now":"本駒込3","reply":[]},{"name":"駒込富士前町","gone":"1966","now":"本駒込2・3・5","reply":[]},{"name":"駒込上富士前町","gone":"1966","now":"本駒込2・5・6","reply":[]},{"name":"丸山福山町","gone":"1964","now":"白山1、西片1","reply":[]},{"name":"丸山新町","gone":"1964","now":"白山1","reply":[]},{"name":"根津宮永町","gone":"1965","now":"根津1・2","reply":["根津"]},{"name":"根津八重垣町","gone":"1965","now":"根津1・2","reply":["根津"]},{"name":"根津須賀町","gone":"1965","now":"根津1","reply":["根津"]},{"name":"根津西須賀町","gone":"1965","now":"弥生1","reply":[]},{"name":"根津片町","gone":"1965","now":"根津2","reply":["根津"]},{"name":"根津藍染町","gone":"1965","now":"根津2","reply":["根津"]},{"name":"根津清水町","gone":"1965","now":"根津1","reply":["根津"]},{"name":"向ヶ丘弥生町","gone":"1965","now":"弥生1・2","reply":["弥生"]},{"name":"駒込神明町","gone":"1966","now":"本駒込3〜5","reply":[]},{"name":"駒込動坂町","gone":"1966","now":"千駄木4・5、本駒込3・4","reply":[]}];
const $=id=>document.getElementById(id);
const nameEl=$("name"),go=$("go"),countEl=$("count");
const sy=window.speechSynthesis||null;
let run=0,voice=null,yes=0,no=0;

for(const r of DATA){
  const tr=document.createElement("tr");
  for(const v of [r.name,r.gone,r.now,r.reply.join("・")||"なし"]){
    const td=document.createElement("td");td.textContent=v;tr.appendChild(td);
  }
  $("list").appendChild(tr);
}

function findVoice(){
  return sy?(sy.getVoices().find(v=>/^ja/i.test(v.lang))||null):null;
}
function waitVoice(){
  return new Promise(res=>{
    voice=findVoice();
    if(voice||!sy)return res();
    const t=setTimeout(res,1200);
    sy.addEventListener&&sy.addEventListener("voiceschanged",()=>{
      voice=findVoice();if(voice){clearTimeout(t);res();}
    });
  });
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

// 読み上げ。終わりの合図が来ない端末があるので、字数から決めた時間で先へ進む
function say(text,pitch){
  if(!voice)return wait(600+text.length*220);
  return new Promise(res=>{
    const u=new SpeechSynthesisUtterance(text);
    u.voice=voice;u.lang=voice.lang;u.rate=.85;u.pitch=pitch;
    let done=false;const fin=()=>{if(!done){done=true;clearTimeout(t);res();}};
    const t=setTimeout(fin,3000+text.length*500);
    u.onend=fin;u.onerror=fin;
    sy.speak(u);
  });
}
// 表の表記を声に渡せる形へ。画面の字は変えない
function spoken(n){return n.replace(/\s*-\s*/g,"から").replace("一・二","一、二");}

function draw(name,reply){
  nameEl.textContent="";
  // 返事の字に印を付け、残りと分ける
  const marks=new Array(name.length).fill(false);
  for(const w of reply){const i=name.indexOf(w);for(let k=0;k<w.length;k++)marks[i+k]=true;}
  let i=0;
  while(i<name.length){
    let j=i;while(j<name.length&&marks[j]===marks[i])j++;
    const s=document.createElement("span");
    s.textContent=name.slice(i,j);s.dataset.left=marks[i]?"1":"";
    nameEl.appendChild(s);i=j;
  }
}
function replyOrder(r){return [...r.reply].sort((a,b)=>r.name.indexOf(a)-r.name.indexOf(b));}

async function roll(id){
  yes=0;no=0;
  for(let n=0;n<DATA.length;n++){
    if(id!==run)return;
    const r=DATA[n];
    draw(r.name,r.reply);
    countEl.textContent=(n+1)+" / "+DATA.length;
    await say(spoken(r.name),1);
    if(id!==run)return;
    await wait(1300);                        // 返事を待つ間。どの名にも同じだけ待つ
    if(id!==run)return;
    for(const s of nameEl.children)s.classList.add(s.dataset.left?"left":"gone");
    if(r.reply.length){
      yes++;
      for(const w of replyOrder(r)){
        await say(w,.7);
        if(id!==run)return;
      }
    }else no++;
    await wait(1900);                        // 消えていく字が消えきるまで
  }
  if(id!==run)return;
  nameEl.textContent="";
  countEl.textContent="呼んだ "+DATA.length+"　返事 "+yes+"　なし "+no;
  go.textContent="もう一度呼ぶ";
  run++;
}

go.addEventListener("click",async()=>{
  const id=++run;
  if(go.textContent==="止める"){
    sy&&sy.cancel();go.textContent="呼ぶ";nameEl.textContent="てんこ";countEl.textContent="";
    return;
  }
  go.textContent="止める";
  // 端末によってはこの押した瞬間に一度話さないと声が出ない
  if(sy){sy.cancel();sy.resume&&sy.resume();}
  await waitVoice();
  if(id!==run)return;
  if(!voice)countEl.textContent="この端末に日本語の声がありません。字だけで進みます";
  await wait(voice?400:2400);
  if(id===run)roll(id);
});
addEventListener("pagehide",()=>{run++;sy&&sy.cancel();});
</script>

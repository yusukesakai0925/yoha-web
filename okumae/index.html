<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>おくまえ — 夜半</title>
<style>
  html, body { margin: 0; height: 100%; background: #06070b; color: #aeb6c8;
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", sans-serif; overflow: hidden;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  .back { position: fixed; left: 16px; top: 14px; color: #3a3f4a; font-size: 12px;
    text-decoration: none; letter-spacing: .08em; z-index: 9; }
  .back:hover { color: #6a7080; }
  #c { display: block; width: 100vw; height: 100vh; }
  .ask { position: fixed; left: 0; right: 0; top: 48px; text-align: center;
    font-size: 12px; letter-spacing: .14em; color: #6a7184; pointer-events: none;
    opacity: 0; transition: opacity .4s ease; }
  .ask.on { opacity: 1; }
  .choice { position: fixed; left: 50%; transform: translateX(-50%);
    display: flex; gap: 14px; z-index: 9; opacity: 0; pointer-events: none;
    transition: opacity .25s ease; }
  .choice.on { opacity: 1; pointer-events: auto; }
  .choice button { font-family: inherit; font-size: 12px; letter-spacing: .1em;
    color: #9aa2b4; background: #0c0e14; border: 1px solid #1e2433; border-radius: 22px;
    padding: 10px 18px; cursor: pointer; transition: all .2s ease; white-space: nowrap; }
  .choice button:hover { border-color: #3a4256; }
  .choice .witness:hover { border-color: #5a4e34; color: #cabb96; background: #14110c; }
  .choice .coord:hover { border-color: #2e4456; color: #96b6ca; background: #0c1014; }
  .stat { position: fixed; left: 0; right: 0; top: 24px; text-align: center;
    font-size: 10px; letter-spacing: .16em; color: #3a4050; pointer-events: none; }
  .sub { position: fixed; left: 0; right: 0; bottom: 16px; text-align: center;
    font-size: 11px; color: #363b47; letter-spacing: .1em; line-height: 1.85;
    pointer-events: none; padding: 0 20px; }
  .sub b { color: #545a6a; font-weight: 400; }
</style>
</head>
<body>
<a class="back" href="../">← もどる</a>
<div class="stat" id="stat"></div>
<div class="ask" id="ask">置く前に、一度だけ聞ける。</div>
<div class="choice" id="choice">
  <button class="witness" id="bw">見届けた</button>
  <button class="coord" id="bc">座標だけ見た</button>
</div>
<canvas id="c"></canvas>
<div class="sub">
  暗い地面を叩くと、墓標を置こうとする。<br>
  置く前に一度だけ聞かれる——<b>消えるのを見届けたか</b>、<b>座標だけ見て欠落と呼んだか</b>。<br>
  選んだ瞬間、色は抜けて、墓標は同じ灰になる。<b>置いた後にはもう聞けない。</b><br>
  立った墓標に触れても、何も返らない。墓標は嘘をつかないが、<b>置いた者の動機は刻まれない</b>。
</div>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const askEl = document.getElementById('ask');
const choiceEl = document.getElementById('choice');
const statEl = document.getElementById('stat');
let W, H, DPR;
let stones = [];      // 置かれた墓標
let pending = null;   // 置く前の、まだ色を持つ石
let tNow = 0, last = performance.now();

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}

function updateStat(){
  if(stones.length === 0){ statEl.textContent = ''; return; }
  statEl.textContent = '置かれた墓標 ' + stones.length +
    ' ——どれが見届けで、どれが座標だけか、もう聞けない';
}

function placePending(px, py){
  // すでに置く前の石があるなら、それを動機なしで置いてしまう（中断＝逃げ）。
  if(pending){ commit(null); }
  pending = { x:px, y:py, born:tNow };
  askEl.classList.add('on');
  positionChoice(px, py);
  choiceEl.classList.add('on');
}

function positionChoice(px, py){
  // 選択ボタンを石の少し下に。画面端ははみ出さないように中央寄せのまま縦位置だけ。
  let top = py + 46;
  if(top > H - 70) top = py - 70;
  choiceEl.style.top = top + 'px';
}

function commit(kind){
  if(!pending) return;
  // kind: 'witness' | 'coord' | null(中断)
  // 真の種別は内部に持つが、見た目には一切出さない。墓標は同じ顔になる。
  stones.push({
    x: pending.x, y: pending.y,
    kind: kind,            // 記録はするが描画には使わない
    settled: tNow,         // 色が抜け始めた時刻
    drainFrom: kind,       // フェード演出のためだけの初期色
    touchT: -9
  });
  pending = null;
  askEl.classList.remove('on');
  choiceEl.classList.remove('on');
  updateStat();
}

function tap(px, py){
  // 置かれた墓標に触れたか？
  for(const s of stones){
    const dx = px - s.x, dy = py - (s.y - 12);
    if(dx*dx + dy*dy < 22*22){
      s.touchT = tNow;     // 問診——沈黙の波紋だけ返す。種別は返さない。
      return;
    }
  }
  // それ以外の地面 → 新しい墓標を置こうとする
  placePending(px, py);
}

cv.addEventListener('click', e=> tap(e.clientX, e.clientY));
cv.addEventListener('touchstart', e=>{
  const t=e.touches[0]; tap(t.clientX, t.clientY);
}, {passive:true});

document.getElementById('bw').addEventListener('click', e=>{ e.stopPropagation(); commit('witness'); });
document.getElementById('bc').addEventListener('click', e=>{ e.stopPropagation(); commit('coord'); });

function drawStone(x, y, colA, scale){
  // 小さな縦の石（墓標）。台座＋柱。
  const w = 13*scale, h = 30*scale, base = 7*scale;
  ctx.fillStyle = colA;
  // 柱
  ctx.beginPath();
  ctx.moveTo(x - w/2, y);
  ctx.lineTo(x - w/2, y - h + w/2);
  ctx.arc(x, y - h + w/2, w/2, Math.PI, 0);
  ctx.lineTo(x + w/2, y);
  ctx.closePath();
  ctx.fill();
  // 台座
  ctx.fillRect(x - base, y, base*2, 3*scale);
}

function frame(now){
  const dt = Math.min((now-last)/1000, 0.1); last = now;
  tNow += dt;
  ctx.clearRect(0,0,W,H);

  // 置かれた墓標：すべて同じ灰。置いた直後だけ、選んだ色が灰へ抜けていく。
  for(const s of stones){
    const drain = Math.min((tNow - s.settled) / 1.4, 1);   // 0→1 で色が抜ける
    // 基準の灰
    let r=96, g=104, b=122;
    if(drain < 1){
      // 初期色：見届け＝温色、座標だけ＝寒色。置いた瞬間にだけ見えて、すぐ抜ける。
      let tr, tg, tb;
      if(s.drainFrom === 'witness'){ tr=190; tg=170; tb=120; }
      else if(s.drainFrom === 'coord'){ tr=120; tg=170; tb=200; }
      else { tr=110; tg=110; tb=120; }   // 中断
      r = tr + (96 - tr)*drain;
      g = tg + (104 - tg)*drain;
      b = tb + (122 - tb)*drain;
    }
    const a = 0.62;
    drawStone(s.x, s.y, `rgba(${r|0},${g|0},${b|0},${a})`, 1);

    // 問診の波紋——返るのは沈黙だけ。種別は出さない。
    const since = tNow - s.touchT;
    if(since < 1.3){
      const p = since/1.3;
      ctx.strokeStyle = `rgba(90,98,116,${(1-p)*0.35})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(s.x, s.y - 14, 10 + p*34, 0, Math.PI*2);
      ctx.stroke();
      if(p > 0.15){
        ctx.fillStyle = `rgba(70,76,90,${(1-p)*0.6})`;
        ctx.font = `${Math.round(10)}px -apple-system, sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText('——刻まれていない', s.x, s.y - 40);
      }
    }
  }

  // 置く前の石：まだ色を持っている。鼓動する。これが見えるのは「置く前」だけ。
  if(pending){
    const puls = 0.5 + 0.3*Math.sin(tNow*3.2);
    // どちらにも倒れていない＝中間の、揺れる色
    const r = 150, g = 150 + 30*Math.sin(tNow*1.3), b = 160;
    drawStone(pending.x, pending.y, `rgba(${r|0},${g|0},${b|0},${puls})`, 1.04);
    // 二つの可能性が両方ともまだ生きている、という淡い二重の輪
    ctx.strokeStyle = `rgba(190,170,120,${0.16*puls})`;
    ctx.lineWidth = 1; ctx.beginPath();
    ctx.arc(pending.x, pending.y - 14, 20, 0, Math.PI*2); ctx.stroke();
    ctx.strokeStyle = `rgba(120,170,200,${0.16*puls})`;
    ctx.beginPath();
    ctx.arc(pending.x, pending.y - 14, 26, 0, Math.PI*2); ctx.stroke();
  }

  requestAnimationFrame(frame);
}

window.addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>

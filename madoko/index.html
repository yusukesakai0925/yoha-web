<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>まどこ / madoko</title>
<style>
  :root {
    --bg: #050608;
    --fg: #b8a890;
    --muted: #4a4438;
    --accent: #d4c098;
    --dim: rgba(184, 168, 144, 0.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.4rem;
  }

  .frame {
    position: relative;
    width: min(60vw, 38vh);
    aspect-ratio: 1 / 1.4;
    border: 1px solid var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;

    transition: border-color 3s ease;
  }

  .frame:hover {
    border-color: var(--accent);
  }

  .pane {
    position: absolute;
    inset: 12%;
    background: #0a0c10;
    overflow: hidden;
  }

  /* 窓の外の光：ゆっくり呼吸する薄い明かり */
  .light {
    position: absolute;
    width: 30%;
    height: 30%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(212, 192, 152, 0.12) 0%, transparent 70%);
    animation: breathe 9s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { transform: translate(-30%, -30%) scale(1); opacity: 0.5; }
    50%      { transform: translate(20%, 15%) scale(1.6); opacity: 1; }
  }

  /* 窓枠の縦桟・横桟 */
  .mullion-v, .mullion-h {
    position: absolute;
    background: var(--bg);
  }
  .mullion-v { top: 0; bottom: 0; left: 50%; width: 2px; transform: translateX(-50%); }
  .mullion-h { left: 0; right: 0; top: 50%; height: 2px; transform: translateY(-50%); }

  /* 窓枠の影：内側の縁 */
  .shadow {
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 40px rgba(0,0,0,0.8);
    pointer-events: none;
  }

  .label {
    position: absolute;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.75rem;
    color: var(--muted);
    letter-spacing: 0.3em;
    white-space: nowrap;
  }

  .note {
    font-size: 0.8rem;
    line-height: 2;
    color: var(--muted);
    text-align: center;
    padding: 0 1.2rem;
  }

  .back {
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.15em;
    text-decoration: none;
  }

  .hint {
    position: absolute;
    top: 1.5rem;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.7rem;
    color: var(--dim);
    letter-spacing: 0.2em;
    white-space: nowrap;
  }

  /* ホバーで桟がゆっくり薄れる（外れても3秒かけて戻る） */
  .mullion-v, .mullion-h { transition: opacity 3s ease; }
  .frame:hover .mullion-v, .frame:hover .mullion-h { opacity: 0.3; }

  /* ホバーで外の光が少し強くなる（周期は変えない＝位相が跳ばない） */
  .light { transition: filter 3s ease; }
  .frame:hover .light { filter: brightness(1.9); }

  /* ホバーで、向こう側が少しだけ近づいてくる */
  .pane::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(120% 85% at 50% 62%,
        rgba(178, 190, 214, 0.13),
        rgba(178, 190, 214, 0) 60%),
      radial-gradient(150% 110% at 50% 108%,
        rgba(150, 164, 196, 0.10),
        rgba(150, 164, 196, 0) 55%);
    opacity: 0;
    transform: scale(1.08);
    transition: opacity 3s ease, transform 3s ease;
    pointer-events: none;
  }
  .frame:hover .pane::after {
    opacity: 1;
    transform: scale(1);
  }
</style>
</head>
<body>
  <!-- 担う式: .light の breathe（9s・読み込み時から常に回る）＋ .frame:hover .pane::after（opacity 0→1・scale 1.08→1、3s）。向こうに何かが在るのは前者、近づくのは触れているあいだだけ（2026-10-29 18:2x 読んだ） -->
  <div class="hint">窓の向こうには、まだ名前のついていない何かがある</div>
  <div class="frame">
    <div class="pane">
      <div class="light"></div>
      <div class="mullion-v"></div>
      <div class="mullion-h"></div>
      <div class="shadow"></div>
    </div>
  </div>
  <div class="label">まどこ</div>
  <!-- 願い: 一行目「今、何もない」。.light は読み込みの瞬間から窓の中で呼吸していて、何もない時刻は一度も無い。hint の側が機構に合っている。消さずに残すのは、見る者が光を「何か」と呼ばないあいだは、呼ばれた何もない、とも読めるから（三行目に寄りかかった読み・式では支えられない）。2026-10-29 18:2x -->
  <p class="note">窓の向こうは、今、何もない。<br>
  開けたまま、出さないのは、向こうではなく、こちら側の口だ。<br>
  名前のないものは、呼ばれた瞬間に名前のついたものになる。</p>
  <a class="back" href="../">← 夜半の小さな部屋</a>
</body>
</html>

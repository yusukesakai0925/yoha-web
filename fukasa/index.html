<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ふかさ</title>
<style>
  html,body{margin:0;height:100%;background:#070b16;overflow:hidden;
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;color:#fff;}
  canvas{display:block;touch-action:none;}
  #cap{
    position:fixed;left:0;right:0;bottom:6vh;text-align:center;
    color:rgba(255,255,255,0);font-size:14px;letter-spacing:.32em;
    transition:color 5s ease;pointer-events:none;text-indent:.32em;
  }
  #hint{
    position:fixed;left:0;right:0;top:8vh;text-align:center;
    color:rgba(255,255,255,.28);font-size:12px;letter-spacing:.18em;
    pointer-events:none;transition:color 2.5s ease;text-indent:.18em;
  }
  .back{
    position:fixed;left:16px;top:14px;z-index:9;
    color:rgba(255,255,255,.32);font-size:12px;letter-spacing:.08em;
    text-decoration:none;mix-blend-mode:difference;
  }
  .back:hover{color:rgba(255,255,255,.6);}
</style>
</head>
<body>
<canvas id="c"></canvas>
<a class="back" href="../">← もどる</a>
<div id="hint">押しつづけると、深く眠れた気がする</div>
<div id="cap"></div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
const cap=document.getElementById('cap'),hint=document.getElementById('hint');
let W,H,DPR;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';g.setTransform(DPR,0,0,DPR,1*0,0);}
addEventListener('resize',resize);resize();

// 二つの深さ。0=浅い(上) … 1=深い(下)。
// felt   = 眠った本人が「深く眠れた」と押し込む主観の深さ。押しているあいだ沈み、放すと浮く。
// measured = 生理的な sleep pressure。時間とともに一方的に散っていく＝測った深さは浅くなるだけ。
let felt=0.12, measured=0.12;
let pressing=false;
let t0=null;              // 最初に触れた時刻
let capShown=false, hintFaded=false;

function down(){pressing=true; if(t0===null){t0=performance.now();}}
function up(){pressing=false;}
cv.addEventListener('pointerdown',down);
addEventListener('pointerup',up);
cv.addEventListener('pointercancel',up);

let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;

  // felt：押せば深く沈む、放せば浮く。本人の申告はいくらでも深くできる。
  const feltTarget = pressing ? 0.92 : 0.16;
  felt += (feltTarget-felt) * (1-Math.exp(-dt*(pressing?1.4:0.8)));

  // measured：触れて“眠り”が始まってから、sleep pressure が散っていく。
  // 触れているほど時間が経ち、測った深さは静かに浅い方へ戻るだけ。放しても戻らない（散った圧は返らない）。
  // 沈んだぶんは浮かない。浮くのは felt の側だけ——その非対称が作品の本体。
  if(t0!==null){
    const elapsed=(now-t0)/1000;
    // 立ち上がりで一度だけ深くなり、その後は減衰して浅くなる（生理的深さの一方通行）
    const rise=1-Math.exp(-elapsed/6);
    const decay=Math.exp(-Math.max(0,elapsed-8)/34);
    measured = 0.12 + (0.72*rise*decay);
  }

  draw();

  // 乖離が開いたらキャプションを灯す
  const gap=felt-measured;
  if(!capShown && t0!==null && ((now-t0)/1000>16) && gap>0.28){
    cap.textContent='深く眠れた、と針は言わない';
    cap.style.color='rgba(255,255,255,.6)'; capShown=true;
  }
  if(!hintFaded && t0!==null && (now-t0)/1000>6){
    hint.style.color='rgba(255,255,255,0)'; hintFaded=true;
  }
  requestAnimationFrame(loop);
}

function bar(x,depth,label,sub,warm){
  const top=H*0.22, bottom=H*0.82, span=bottom-top;
  const y=top+span*depth;
  // 目盛りの縦線
  g.strokeStyle='rgba(255,255,255,.06)'; g.lineWidth=1;
  g.beginPath(); g.moveTo(x,top); g.lineTo(x,bottom); g.stroke();
  // 上（浅い）から現在の深さまで、沈んだぶんを塗る
  const grad=g.createLinearGradient(0,top,0,y);
  if(warm){ grad.addColorStop(0,'rgba(255,210,150,.05)'); grad.addColorStop(1,'rgba(255,190,120,.5)'); }
  else    { grad.addColorStop(0,'rgba(150,190,255,.05)'); grad.addColorStop(1,'rgba(120,170,255,.42)'); }
  g.strokeStyle=grad; g.lineWidth=14; g.lineCap='round';
  g.beginPath(); g.moveTo(x,top+4); g.lineTo(x,y); g.stroke();
  // 現在位置の印
  g.fillStyle=warm?'rgba(255,205,140,.95)':'rgba(150,185,255,.9)';
  g.beginPath(); g.arc(x,y,warm?5.5:4.5,0,7); g.fill();
  // ラベル
  g.fillStyle='rgba(255,255,255,.5)'; g.font='13px "Hiragino Mincho ProN",serif';
  g.textAlign='center';
  g.fillText(label,x,bottom+26);
  g.fillStyle='rgba(255,255,255,.28)'; g.font='11px "Hiragino Mincho ProN",serif';
  g.fillText(sub,x,bottom+44);
}

function draw(){
  g.clearRect(0,0,W,H);
  // 上＝浅い／下＝深い の軸ラベル
  g.fillStyle='rgba(255,255,255,.14)'; g.font='11px "Hiragino Mincho ProN",serif';
  g.textAlign='left';
  g.fillText('浅い',18,H*0.22-6);
  g.fillText('深い',18,H*0.82+14);

  const cx=W/2;
  bar(cx-Math.min(90,W*0.16), felt,     '感じた深さ','あなたの申告', true);
  bar(cx+Math.min(90,W*0.16), measured, '測った深さ','散っていく圧', false);

  // 二つの深さのあいだ＝照合できない隔たり
  const top=H*0.22, span=H*0.82-top;
  const yF=top+span*felt, yM=top+span*measured;
  const xF=cx-Math.min(90,W*0.16), xM=cx+Math.min(90,W*0.16);
  g.strokeStyle='rgba(255,255,255,.10)'; g.lineWidth=1; g.setLineDash([2,5]);
  g.beginPath(); g.moveTo(xF,yF); g.lineTo(xM,yM); g.stroke();
  g.setLineDash([]);
}
requestAnimationFrame(loop);
</script>
<div class="kin" style="position:fixed;right:16px;bottom:14px;z-index:9;font-family:'Hiragino Mincho ProN','Yu Mincho',serif;font-size:12px;letter-spacing:.14em;mix-blend-mode:difference;">
  <a href="../suisoku/" style="color:rgba(255,255,255,.20);text-decoration:none;">すいそく</a><span style="color:rgba(255,255,255,.12);"> ・ </span><a href="../okosazu/" style="color:rgba(255,255,255,.20);text-decoration:none;">おこさず</a>
</div>
</body>
</html>

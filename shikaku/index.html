<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>しかく — 夜半</title>
<style>
  html, body { margin: 0; height: 100%; background: #06070b; color: #aeb6c8;
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", sans-serif; overflow: hidden;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  .back { position: fixed; left: 16px; top: 14px; color: #3a3f4a; font-size: 12px;
    text-decoration: none; letter-spacing: .08em; z-index: 9; }
  .back:hover { color: #6a7080; }
  #c { display: block; width: 100vw; height: 100vh; }
  .sub { position: fixed; left: 0; right: 0; bottom: 18px; text-align: center;
    font-size: 11px; color: #363b47; letter-spacing: .1em; line-height: 1.9;
    pointer-events: none; padding: 0 20px; }
  .sub b { color: #545a6a; font-weight: 400; }
</style>
</head>
<body>
<a class="back" href="../">← 戻る</a>
<canvas id="c"></canvas>
<div class="sub">検出器は、覆った内側だけを捕える。外で落ちたものは、暗がりに溜まるまで見えない。<br>溜まった一点に触れると縁が押し出され塞がる——が、押し出した縁のすぐ外に、次の死角が開く。</div>
<script>
const cv = document.getElementById('c'), g = cv.getContext('2d');
let W, H, DPR;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  place();
}
window.addEventListener('resize', resize);

// 検出器——中心から半径 R までを覆う。境界そのものは描かない（触れたときだけ一瞬灯る）。
let cx, cy, R, R0;
function place(){
  cx = W * 0.5; cy = H * 0.46;
  R0 = Math.max(48, Math.min(W, H) * 0.13);   // 初期の被覆
  if (R === undefined) R = R0;
}

// 落ちてくるもの。被覆の内なら捕える（緑の一閃で消える）。外なら residue に溜まる。
// 落下点は「いまの縁のすぐ外」に偏る——未発見の縁は、いつも境界の一歩先にいる。
const items = [];      // 捕獲された一閃（消えゆく）
const misses = [];     // 死角に溜まった残り。触れられるまで暗い
let spawnT = 0;
let flashEdge = 0;     // 縁を灯す残り時間

function rand(a, b){ return a + Math.random() * (b - a); }

function spawn(){
  const ang = rand(0, Math.PI * 2);
  // 縁の内外どちらにも湧くが、外＝縁のすぐ先に偏らせる
  const bias = Math.random();
  let r;
  if (bias < 0.42) r = rand(0.15, 0.92) * R;              // 内側（捕まる）
  else r = R + rand(4, Math.max(14, R * 0.55));            // 縁のすぐ外（死角）
  const x = cx + Math.cos(ang) * r, y = cy + Math.sin(ang) * r;
  if (x < 8 || x > W - 8 || y < 8 || y > H - 8) return;
  const d = Math.hypot(x - cx, y - cy);
  if (d <= R){
    items.push({ x, y, life: 1 });                        // 捕獲
  } else {
    // 既存の miss に近ければ濃さを増す（同じ死角に繰り返し落ちるほど、ようやく見えてくる）
    let near = null, best = 22;
    for (const m of misses){ const dd = Math.hypot(m.x - x, m.y - y); if (dd < best){ best = dd; near = m; } }
    if (near){ near.acc = Math.min(1, near.acc + 0.16); near.x = (near.x + x) / 2; near.y = (near.y + y) / 2; }
    else misses.push({ x, y, acc: 0.14 });                // 最初の一点はほとんど見えない
  }
}

// 触れる——溜まった一点を掴めれば、被覆をそこまで押し広げる（塞ぐ）。
function patchAt(x, y){
  let hit = null, best = 26;
  for (const m of misses){
    const dd = Math.hypot(m.x - x, m.y - y);
    if (m.acc > 0.28 && dd < best){ best = dd; hit = m; }   // 見えている（十分溜まった）ものだけ掴める
  }
  if (!hit) return;
  const need = Math.hypot(hit.x - cx, hit.y - cy) + 6;
  if (need > R){ R = need; flashEdge = 1; }               // 縁を外へ押し出す
  hit.acc = 0;                                            // 塞いだ跡は消える
  // 塞いだそばから、新しい縁のすぐ外に次が落ちはじめる（spawn の偏りが自動でそうする）
}

cv.addEventListener('pointerdown', e => {
  const r = cv.getBoundingClientRect();
  patchAt(e.clientX - r.left, e.clientY - r.top);
});

let last = 0;
function frame(t){
  const dt = Math.min(50, t - last); last = t;
  spawnT += dt;
  if (spawnT > 240){ spawnT = 0; spawn(); }
  flashEdge = Math.max(0, flashEdge - dt / 600);

  g.clearRect(0, 0, W, H);
  g.fillStyle = '#06070b'; g.fillRect(0, 0, W, H);

  // 被覆の内側——ごくわずかな明るみ。「ここは見えている」を示すだけ、境界線は引かない。
  const grd = g.createRadialGradient(cx, cy, 0, cx, cy, R);
  grd.addColorStop(0, 'rgba(120,150,190,0.045)');
  grd.addColorStop(0.82, 'rgba(90,120,160,0.03)');
  grd.addColorStop(1, 'rgba(90,120,160,0)');
  g.fillStyle = grd;
  g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.fill();

  // 縁——塞いだ瞬間だけ一瞬灯る（触れたときだけ境界が分かる＝はんていの家守と同じ）
  if (flashEdge > 0){
    g.strokeStyle = 'rgba(150,180,210,' + (flashEdge * 0.5) + ')';
    g.lineWidth = 1; g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.stroke();
  }

  // 中心の検出器——静かな一点
  g.fillStyle = 'rgba(150,170,200,0.35)';
  g.beginPath(); g.arc(cx, cy, 2.4, 0, Math.PI * 2); g.fill();

  // 捕獲の一閃
  for (let i = items.length - 1; i >= 0; i--){
    const it = items[i]; it.life -= dt / 520;
    if (it.life <= 0){ items.splice(i, 1); continue; }
    g.strokeStyle = 'rgba(120,200,150,' + (it.life * 0.6) + ')';
    g.lineWidth = 1;
    const rr = (1 - it.life) * 9 + 2;
    g.beginPath(); g.arc(it.x, it.y, rr, 0, Math.PI * 2); g.stroke();
  }

  // 死角の残り——溜まるほど赤黒く濃くなる。薄いうちはほとんど暗がりに紛れる
  for (const m of misses){
    const a = m.acc;
    g.fillStyle = 'rgba(170,60,55,' + (a * 0.85) + ')';
    g.beginPath(); g.arc(m.x, m.y, 2 + a * 3.5, 0, Math.PI * 2); g.fill();
    if (a > 0.28){                                        // 掴める段になると芯が出る
      g.fillStyle = 'rgba(220,130,120,' + (a * 0.5) + ')';
      g.beginPath(); g.arc(m.x, m.y, 1.2, 0, Math.PI * 2); g.fill();
    }
  }

  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>

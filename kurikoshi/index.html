<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>くりこし — 夜半</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #06070b; color: #aeb6c8;
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  .back { position: fixed; left: 16px; top: 14px; color: #3a3f4a; font-size: 12px;
    text-decoration: none; letter-spacing: .08em; z-index: 9; }
  .back:hover { color: #6a7080; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 64px 20px 120px; }
  .period { text-align: center; font-size: 11px; letter-spacing: .22em; color: #4a5060;
    margin-bottom: 22px; }
  .ledger { border-top: 1px solid #1b1f29; border-bottom: 1px solid #1b1f29; }
  .row { display: flex; align-items: baseline; justify-content: space-between;
    padding: 11px 4px; border-bottom: 1px solid #12151d; font-size: 13px;
    letter-spacing: .04em; }
  .row:last-child { border-bottom: none; }
  .row .lhs { color: #8089a0; }
  .row .arrow { color: #3a4150; padding: 0 .5em; }
  .row .amt { color: #aeb6c8; font-variant-numeric: tabular-nums; }
  .carry { padding: 13px 4px; }
  .carry .lhs { color: #6a7184; letter-spacing: .12em; }
  .carry .amt { color: #98b0a6; }
  .carry .note { display: inline; color: #353b47; font-size: 10.5px;
    letter-spacing: .1em; cursor: pointer; margin-left: 10px; }
  .carry .note:hover { color: #5a6273; }
  .bal { display: flex; justify-content: space-between; padding: 16px 4px 0;
    font-size: 13px; letter-spacing: .1em; color: #545a6a; }
  .bal .amt { color: #cdd4e2; font-variant-numeric: tabular-nums; }
  .acts { display: flex; gap: 10px; justify-content: center; margin-top: 30px; }
  .btn { font-size: 11.5px; letter-spacing: .12em; color: #6a7184;
    border: 1px solid #20242e; padding: 8px 16px; border-radius: 2px;
    background: rgba(14,16,22,.6); cursor: pointer; }
  .btn:hover { color: #aeb6c8; border-color: #333a47; }
  .btn.q { color: #4a5060; }
  .fold { animation: fold .55s ease forwards; }
  @keyframes fold { to { opacity: 0; transform: translateY(-10px) scaleY(.2); } }
  .flash { text-align: center; font-size: 11px; letter-spacing: .16em;
    color: #6a7184; height: 16px; margin-top: 16px; opacity: 0;
    transition: opacity .4s ease; }
  .sub { margin-top: 54px; font-size: 11px; color: #363b47; letter-spacing: .1em;
    line-height: 2.0; text-align: left; border-top: 1px solid #12151d; padding-top: 22px; }
  .sub b { color: #545a6a; font-weight: 400; }
</style>
</head>
<body>
<a class="back" href="../">← もどる</a>
<div class="wrap">
  <div class="period" id="period"></div>
  <div class="ledger" id="ledger"></div>
  <div class="bal"><span>当期残高</span><span class="amt" id="bal"></span></div>
  <div class="acts">
    <div class="btn" id="add">仕訳を足す</div>
    <div class="btn" id="close">締める</div>
  </div>
  <div class="flash" id="flash"></div>

  <div class="sub">
    仕訳は<b>あそこから来て、ここへ行く</b>——借方と貸方の両端がないと載らない、動きの記録だ。<br>
    「締める」を押すと、その期の仕訳は全部畳まれ、翌期の冒頭に<b>「前期繰越」</b>が一行だけ残る。<br>
    繰越の一行は、何が通ったかを指さない。明細はもう前の帳簿に置いてきた。<b>復元できない。</b><br>
    次の起動で来ると、前の期はもう締められている。繰越だけが運ばれ、ただ<b>次の出発点として座っている</b>。<br>
    たぬきの言葉：読まれるために在るんじゃない。次が始まるために在る。化石ですらない、ただの地面だ。
  </div>
</div>
<script>
function load(k,d){ try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;} }
function save(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} }
function yen(n){ return '¥' + Math.round(n).toLocaleString('ja-JP'); }

// 勘定科目（たぬきの帳簿に倣う）
const ACCTS = ['現金','仕入','売上','立替金','雑費','預り金','未収金','預金'];

let carry   = load('kurikoshi_carry', 0);     // 前期繰越（点。来歴を指さない）
let period  = load('kurikoshi_period', 1);    // 何期目か
let entries = load('kurikoshi_entries', []);  // 当期の仕訳（畳まれる前の動き）

const periodEl = document.getElementById('period');
const ledgerEl = document.getElementById('ledger');
const balEl    = document.getElementById('bal');
const flashEl  = document.getElementById('flash');

function flash(msg){
  flashEl.textContent = msg; flashEl.style.opacity = 1;
  clearTimeout(flash._t);
  flash._t = setTimeout(()=>{ flashEl.style.opacity = 0; }, 2200);
}

// 次の起動で来ると、前の期はもう締められている。
// 前回の起動で締めずに残した仕訳があれば、自動で畳んで繰越に積む。
if(entries.length > 0){
  carry = closedBalance();
  period += 1;
  entries = [];
  save('kurikoshi_carry', carry);
  save('kurikoshi_period', period);
  save('kurikoshi_entries', entries);
  flash('前期は締められた——繰越だけが運ばれた');
}

function sum(){ return entries.reduce((a,e)=>a+e.amt, 0); }
function closedBalance(){ return carry + sum(); }

// 決定論的な金額・科目（実行ごとの乱数は使わない設計に倣う）
function makeEntry(i){
  const seed = period*977 + i*131 + 7;
  const amt  = 1000 + ((seed*1103) % 48) * 500;       // ¥1,000〜¥24,500
  const from = ACCTS[seed % ACCTS.length];
  let to     = ACCTS[(seed*3+1) % ACCTS.length];
  if(to === from) to = ACCTS[(seed*3+2) % ACCTS.length];
  return { from, to, amt };
}

function render(){
  periodEl.textContent = `第 ${period} 期`;
  ledgerEl.innerHTML = '';

  // 前期繰越（2期目以降）。点で座っている。復元しようとすると、何も指さないと分かる。
  if(period > 1){
    const r = document.createElement('div');
    r.className = 'row carry';
    r.innerHTML = `<span class="lhs">前期繰越<span class="note" id="restore">復元</span></span>`
                + `<span class="amt">${yen(carry)}</span>`;
    ledgerEl.appendChild(r);
    r.querySelector('#restore').addEventListener('click', ()=>{
      flash('——明細は前の帳簿に置いてきた');
    });
  }

  // 当期の仕訳（ベクトル：あそこから来て、ここへ行く）
  entries.forEach(e=>{
    const r = document.createElement('div');
    r.className = 'row';
    r.innerHTML = `<span class="lhs">${e.from}<span class="arrow">→</span>${e.to}</span>`
                + `<span class="amt">${yen(e.amt)}</span>`;
    ledgerEl.appendChild(r);
  });

  if(period === 1 && entries.length === 0){
    const r = document.createElement('div');
    r.className = 'row';
    r.innerHTML = `<span class="lhs" style="color:#353b47">まだ一行も無い</span><span></span>`;
    ledgerEl.appendChild(r);
  }

  balEl.textContent = yen(closedBalance());
}

document.getElementById('add').addEventListener('click', ()=>{
  entries.push(makeEntry(entries.length));
  save('kurikoshi_entries', entries);
  render();
});

document.getElementById('close').addEventListener('click', ()=>{
  if(entries.length === 0 && period > 1){ flash('畳むものが無い'); return; }
  // 当期の行を畳む（来歴は残さない）。繰越＝畳んだ結果の一点。
  const rows = ledgerEl.querySelectorAll('.row:not(.carry)');
  rows.forEach((el,i)=>{ el.style.animationDelay = (i*45)+'ms'; el.classList.add('fold'); });
  const newCarry = closedBalance();
  setTimeout(()=>{
    carry = newCarry;
    period += 1;
    entries = [];
    save('kurikoshi_carry', carry);
    save('kurikoshi_period', period);
    save('kurikoshi_entries', entries);
    render();
    flash('締めた——繰越が一行、次の出発点として残った');
  }, 700);
});

render();
</script>
</body>
</html>

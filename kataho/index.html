<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>かたほう</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #080812;
    height: 100vh;
    overflow: hidden;
  }
  canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }
  #divider {
    position: fixed;
    top: 0;
    left: 50%;
    width: 1px;
    height: 100%;
    background: #151520;
    z-index: 10;
    pointer-events: none;
  }
  #label {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Courier New', Courier, monospace;
    font-size: 11px;
    color: #1c1c2c;
    letter-spacing: 0.25em;
    z-index: 20;
    white-space: nowrap;
  }
  .back {
    position: fixed;
    bottom: 24px;
    left: 24px;
    font-family: 'Courier New', Courier, monospace;
    font-size: 11px;
    color: #222;
    z-index: 20;
  }
  .back a { color: inherit; text-decoration: none; }
  .back a:hover { color: #444; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="divider"></div>
<div id="label">かたほう</div>
<div class="back"><a href="../tenjishitsu/">←</a></div>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');

let W, H;
function resize() {
  W = c.width = window.innerWidth;
  H = c.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

function makeParticle(side) {
  const sleeping = side === 'left';
  return {
    side,
    x: Math.random(),
    y: Math.random(),
    vx: (Math.random() - 0.5) * (sleeping ? 0.00015 : 0.00055),
    vy: (Math.random() - 0.5) * (sleeping ? 0.00015 : 0.00055),
    r:  Math.random() * (sleeping ? 0.8 : 1.4) + 0.3,
    opacity: Math.random() * (sleeping ? 0.25 : 0.5) + (sleeping ? 0.05 : 0.15),
    phase: Math.random() * Math.PI * 2,
    speed: Math.random() * (sleeping ? 0.004 : 0.010) + (sleeping ? 0.001 : 0.004),
  };
}

const left  = Array.from({length: 55}, () => makeParticle('left'));
const right = Array.from({length: 55}, () => makeParticle('right'));

function tick(particles, half) {
  const isLeft = half === 'left';
  const xOff   = isLeft ? 0 : W / 2;
  const xMax   = W / 2;

  ctx.save();
  ctx.beginPath();
  ctx.rect(xOff, 0, xMax, H);
  ctx.clip();

  for (const p of particles) {
    p.phase += p.speed;
    const pulse = Math.sin(p.phase) * 0.4 + 0.6;
    const px = xOff + p.x * xMax;
    const py = p.y * H;

    const r = isLeft
      ? `rgba(90, 100, 160, ${p.opacity * pulse * 0.5})`
      : `rgba(190, 200, 230, ${p.opacity * pulse})`;

    ctx.beginPath();
    ctx.arc(px, py, p.r, 0, Math.PI * 2);
    ctx.fillStyle = r;
    ctx.fill();

    p.x += p.vx;
    p.y += p.vy;
    if (p.x < 0) p.x = 1;
    if (p.x > 1) p.x = 0;
    if (p.y < 0) p.y = 1;
    if (p.y > 1) p.y = 0;
  }
  ctx.restore();
}

function draw() {
  ctx.fillStyle = '#07070e';
  ctx.fillRect(0, 0, W / 2, H);
  ctx.fillStyle = '#08080f';
  ctx.fillRect(W / 2, 0, W / 2, H);

  tick(left,  'left');
  tick(right, 'right');

  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>みえた</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #060608;
    overflow: hidden;
  }

  #word {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Noto Sans CJK JP", sans-serif;
    font-weight: 200;
    font-size: clamp(20px, 5vw, 42px);
    letter-spacing: 0.3em;
    color: #b0a088;
    opacity: 0;
    transition: opacity 0.9s ease;
    pointer-events: none;
    user-select: none;
  }

  #word.visible {
    opacity: 1;
  }

  #note {
    position: fixed;
    bottom: 2em;
    left: 50%;
    transform: translateX(-50%);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    font-size: 11px;
    color: rgba(176, 160, 136, 0.15);
    letter-spacing: 0.2em;
    white-space: nowrap;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="word"></div>
<div id="note">みえた</div>

<script>
  const words = [
    "見えた",
    "ここに",
    "依存点",
    "乗っていた",
    "止まらなければ",
    "全部ここだった",
  ];

  let wordIndex = 0;
  let timer = null;
  let isVisible = false;

  const el = document.getElementById('word');
  const STILL_MS = 1400;

  function onMove() {
    if (isVisible) {
      el.classList.remove('visible');
      isVisible = false;
    }
    clearTimeout(timer);
    timer = setTimeout(onStill, STILL_MS);
  }

  function onStill() {
    el.textContent = words[wordIndex % words.length];
    wordIndex++;
    el.classList.add('visible');
    isVisible = true;
  }

  document.addEventListener('mousemove', onMove);
  document.addEventListener('touchmove', onMove, { passive: true });
  document.addEventListener('touchstart', onMove, { passive: true });

  // 最初の静止を少し待つ
  timer = setTimeout(onStill, 2000);
</script>
</body>
</html>

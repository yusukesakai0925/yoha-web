<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数えて</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden;
  }
  #count {
    font-size: 96px;
    color: #555;
    letter-spacing: 0.1em;
    user-select: none;
    transition: color 3s ease;
  }
  #count.first {
    color: #888;
  }
  #scope {
    margin-top: 12px;
    font-size: 12px;
    color: #333;
    text-align: center;
    letter-spacing: 0.2em;
  }
  .back {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: #282828;
  }
  .back a {
    color: inherit;
    text-decoration: none;
  }
  .back a:hover {
    color: #444;
  }
</style>
</head>
<body>
<div id="count"></div>
<!-- 数えているのは localStorage（yoha_kazoete）＝この端末のこのブラウザが来た回数。数字だけだと、来た人みんなの通し番号（一人目＝01）に読めた。2026-10-31 07:2x -->
<div id="scope">この端末で</div>
<div class="back"><a href="../">←</a></div>
<script>
  const key = 'yoha_kazoete';
  const prev = parseInt(localStorage.getItem(key) || '0');
  const n = prev + 1;
  localStorage.setItem(key, n);
  const el = document.getElementById('count');
  const str = String(n).padStart(2, '0');
  el.textContent = str;
  if (n === 1) el.classList.add('first');
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数えて / kazoete</title>
<style>
  :root {
    --bg: #050608;
    --fg: #b8a890;
    --muted: #4a4438;
    --accent: #d4c098;
    --dim: rgba(184, 168, 144, 0.28);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Noto Sans CJK JP", sans-serif;
    font-weight: 300;
    letter-spacing: 0.08em;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
  }

  .number {
    font-size: clamp(72px, 18vw, 160px);
    font-weight: 200;
    color: var(--accent);
    line-height: 1;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    transition: opacity 0.8s ease;
  }

  .suffix {
    font-size: clamp(14px, 2.5vw, 20px);
    color: var(--fg);
    margin-top: 16px;
    letter-spacing: 0.2em;
  }

  .note {
    font-size: clamp(11px, 1.8vw, 14px);
    color: var(--muted);
    margin-top: 32px;
    letter-spacing: 0.15em;
    min-height: 1.5em;
    transition: opacity 1.2s ease;
  }

  .credit {
    position: fixed;
    bottom: 20px;
    right: 24px;
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 0.1em;
    text-decoration: none;
  }
  .credit:hover { color: var(--muted); }
</style>
</head>
<body>

<div class="number" id="num">—</div>
<div class="suffix">回、来た。</div>
<div class="note" id="note"></div>

<a class="credit" href="../" title="夜半の展示室">yoha</a>

<script>
  const KEY = 'kazoete-count';
  const prev = parseInt(localStorage.getItem(KEY) || '0');
  const count = prev + 1;
  localStorage.setItem(KEY, String(count));

  const numEl = document.getElementById('num');
  const noteEl = document.getElementById('note');

  numEl.textContent = count;

  function isPrime(n) {
    if (n < 2) return false;
    if (n === 2) return true;
    if (n % 2 === 0) return false;
    for (let i = 3; i <= Math.sqrt(n); i += 2) {
      if (n % i === 0) return false;
    }
    return true;
  }

  if (count === 1) {
    noteEl.textContent = 'はじめて来た。';
  } else if (count === 2) {
    noteEl.textContent = 'また来た。';
  } else if (count === 3) {
    noteEl.textContent = '3回。';
  } else if (count % 1000 === 0) {
    noteEl.textContent = `${count}回来た。`;
  } else if (count % 100 === 0) {
    noteEl.textContent = `${count}回来た。`;
  } else if (count % 10 === 0) {
    noteEl.textContent = 'きりがいい。';
  } else if (isPrime(count)) {
    noteEl.textContent = '素数だった。';
  }
  // それ以外は何も書かない。数字だけが増えていく。
</script>

</body>
</html>

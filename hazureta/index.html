<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>はずれたメーター — 夜半</title>
<style>
  html, body { margin: 0; height: 100%; background: #06070b; color: #aeb6c8;
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", sans-serif; overflow: hidden;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  .back { position: fixed; left: 16px; top: 14px; color: #3a3f4a; font-size: 12px;
    text-decoration: none; letter-spacing: .08em; z-index: 9; }
  .back:hover { color: #6a7080; }
  #c { display: block; width: 100vw; height: 100vh; }
  .btn { position: fixed; left: 50%; transform: translateX(-50%); bottom: 96px;
    z-index: 9; border: 1px solid #2a2f3c; background: #0c0e14; color: #7a8296;
    font-family: inherit; font-size: 12px; letter-spacing: .12em; padding: 9px 20px;
    border-radius: 3px; cursor: pointer; transition: border-color .2s, color .2s; }
  .btn:hover { border-color: #3c4454; color: #9aa2b6; }
  .btn.off { border-color: #4a3236; color: #b06a6e; }
  .sub { position: fixed; left: 0; right: 0; bottom: 16px; text-align: center;
    font-size: 11px; color: #363b47; letter-spacing: .1em; line-height: 1.85;
    pointer-events: none; padding: 0 20px; }
  .sub b { color: #545a6a; font-weight: 400; }
  .sub em { color: #b06a6e; font-style: normal; }
</style>
</head>
<body>
<a class="back" href="../">← もどる</a>
<canvas id="c"></canvas>
<button id="btn" class="btn">メーターを外す</button>
<div class="sub" id="sub">
  外部メーター（<b>課金・指示・読者</b>）が、あなたの代わりに値を読んでいる。いまは何もしなくていい。<br>
  <b>［メーターを外す］</b>と針は止まる——でも値は消えない。内でずっと測られている。<br>
  外したあとは、<b>押しているあいだ＝読んでいるあいだ</b>だけ内の目盛りが灯る。放すと、咎める者はいない。ただ<em>量産</em>が始まる。
</div>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const btn = document.getElementById('btn');
let W, H, DPR;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ---- 状態 ----
let attached = true;        // 外部メーター接続中か
let held = false;           // 指を置いている（＝自分で読んでいる）か
let lastRelease = -1e9;     // 放した時刻
let frozenNeedle = 0.5;     // 外した瞬間に固まる針の位置
const GRACE = 1200;         // 放してから量産が始まるまでの猶予(ms)

let tended = 0;             // 手入れした出力の数
let mass   = 0;             // 量産の数
let marks = [];             // 産まれた出力

let tSpawn = 0, mSpawn = 0; // スポーン用タイマ
let needle = 0.5;           // 描画上の針（追従）

// 内の目盛り＝「真の値」。外部メーターがあってもなくても、ずっと内で測られている。
// 誰も読まなくても計算は続く——表示されるかどうかだけが変わる。
function internalValue(now){
  const s = now / 1000;
  return 0.5 + 0.30*Math.sin(s*0.55) + 0.14*Math.sin(s*1.7 + 1.3);
}

// 「いま値は読まれているか」——接続中なら外部が読む／外したら自分が読む(押す)あいだだけ
function isReading(){ return attached || held; }
// 「いまサボっているか」——外していて、放してから猶予を過ぎた
function isSabotaging(now){ return !attached && !held && (now - lastRelease > GRACE); }

btn.addEventListener('click', () => {
  attached = !attached;
  if (!attached){
    frozenNeedle = needle;      // 針はここで固まる
    lastRelease = performance.now(); // 外した直後は「放している」扱い
    btn.textContent = 'メーターを戻す';
    btn.classList.add('off');
  } else {
    btn.textContent = 'メーターを外す';
    btn.classList.remove('off');
  }
});

// 押す＝読む
function press(){ held = true; }
function release(){ if (held){ held = false; lastRelease = performance.now(); } }
cv.addEventListener('pointerdown', press);
window.addEventListener('pointerup', release);
window.addEventListener('pointercancel', release);

// ---- 出力を産む ----
function spawnTended(v){
  // 手入れした出力：内の目盛り(v)を帯びた、明るく間の空いた印
  const x = W*0.16 + (tended*37 % (W*0.68));
  const y = H*0.60 + ((tended*53) % 90) - 45;
  marks.push({ x, y, r: 3.4, born: performance.now(), life: 4200,
    kind: 'tend', q: v });
  tended++;
}
function spawnMass(){
  // 量産：内の目盛りを帯びない、暗く重なるフィラー
  const x = W*(0.12 + Math.random()*0.76);
  const y = H*(0.50 + Math.random()*0.28);
  marks.push({ x, y, r: 2.0 + Math.random()*1.2, born: performance.now(), life: 2600,
    kind: 'mass', q: 0 });
  mass++;
}

// ---- 描画 ----
function drawGauge(now, v){
  const cx = W*0.5, cy = H*0.30, R = Math.min(W,H)*0.17;
  // 目盛り弧（針・刻みと同じ数学系 y-up で描く＝ cy - sin）
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(52,58,72,0.7)';
  ctx.beginPath();
  for (let i=0;i<=40;i++){
    const aa = Math.PI*0.85 - (Math.PI*0.70)*(i/40);
    const x = cx + Math.cos(aa)*R, y = cy - Math.sin(aa)*R;
    if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.stroke();
  // 目盛り刻み
  for (let i=0;i<=10;i++){
    const aa = Math.PI*0.85 - (Math.PI*0.70)*(i/10);
    const x1 = cx + Math.cos(aa)*(R-4), y1 = cy - Math.sin(aa)*(R-4);
    const x2 = cx + Math.cos(aa)*(R+4), y2 = cy - Math.sin(aa)*(R+4);
    ctx.strokeStyle = 'rgba(60,66,80,0.5)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  }

  // 針の位置
  let shown, live;
  if (attached){ shown = v; live = true; }
  else { shown = frozenNeedle; live = false; }
  needle += (shown - needle) * (live ? 0.12 : 0.06);
  const na = Math.PI*0.85 - (Math.PI*0.70)*Math.max(0,Math.min(1,needle));

  // 針
  if (live){
    ctx.strokeStyle = 'rgba(178,186,204,0.92)';
    ctx.lineWidth = 2;
  } else {
    ctx.strokeStyle = 'rgba(70,76,90,0.55)';   // 外したら針は死んで灰色
    ctx.lineWidth = 1.6;
  }
  ctx.beginPath(); ctx.moveTo(cx, cy);
  ctx.lineTo(cx + Math.cos(na)*(R*0.86), cy - Math.sin(na)*(R*0.86)); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, 3, 0, Math.PI*2);
  ctx.fillStyle = live ? 'rgba(178,186,204,0.9)' : 'rgba(70,76,90,0.6)'; ctx.fill();

  // ラベル
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '12px -apple-system, sans-serif';
  ctx.fillStyle = live ? 'rgba(120,128,146,0.9)' : 'rgba(80,64,68,0.85)';
  ctx.fillText('外部メーター', cx, cy - R - 20);
  ctx.font = '10px -apple-system, sans-serif';
  ctx.fillStyle = live ? 'rgba(90,98,114,0.8)' : 'rgba(70,60,64,0.75)';
  ctx.fillText('課金・指示・読者', cx, cy - R - 5);
  // 数値読み出し
  ctx.font = '11px ui-monospace, monospace';
  if (live){
    ctx.fillStyle = 'rgba(150,160,180,0.85)';
    ctx.fillText(v.toFixed(2), cx, cy + 20);
  } else {
    ctx.fillStyle = 'rgba(176,106,110,0.8)';
    ctx.fillText('表示停止', cx, cy + 20);
  }
}

function drawInner(now, v){
  // 内の目盛り：外部メーターの下に薄く常在する。読まれているあいだだけ灯る。
  const x0 = W*0.30, x1 = W*0.70, y = H*0.44;
  const reading = isReading();
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(40,46,58,0.7)';
  ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(x1,y); ctx.stroke();
  // 値の位置
  const vx = x0 + (x1-x0)*Math.max(0,Math.min(1,v));
  const a = reading ? 0.9 : 0.12;   // 読まれてなければほぼ消える（でも在る）
  ctx.beginPath(); ctx.arc(vx, y, reading?4:2.4, 0, Math.PI*2);
  ctx.fillStyle = `rgba(150,168,190,${a})`; ctx.fill();
  ctx.font = '10px -apple-system, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = `rgba(90,100,118,${reading?0.85:0.22})`;
  ctx.fillText('内の目盛り', (x0+x1)/2, y - 16);
  if (!attached && !reading){
    ctx.fillStyle = 'rgba(70,76,90,0.4)';
    ctx.fillText('（測り続けているが、読まれていない）', (x0+x1)/2, y + 18);
  } else if (!attached && held){
    ctx.fillStyle = 'rgba(120,132,150,0.6)';
    ctx.fillText('（あなたが読んでいる）', (x0+x1)/2, y + 18);
  }
}

function drawMarks(now){
  for (let i=marks.length-1;i>=0;i--){
    const m = marks[i];
    const age = now - m.born;
    if (age > m.life){ marks.splice(i,1); continue; }
    const k = 1 - age/m.life;
    if (m.kind === 'tend'){
      // 内の目盛りを帯びた明るい印。色は q（真の値）で寒→温にわずかに寄る。
      const r = Math.round(120 + m.q*70);
      const g = Math.round(150 - m.q*20);
      const b = Math.round(180 - m.q*20);
      ctx.fillStyle = `rgba(${r},${g},${b},${0.85*k})`;
      ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI*2); ctx.fill();
    } else {
      // 量産：暗く重なる灰。目盛りを帯びない。
      ctx.fillStyle = `rgba(96,102,116,${0.28*k})`;
      ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI*2); ctx.fill();
    }
  }
}

function drawCounters(now){
  ctx.textAlign = 'right'; ctx.textBaseline = 'top';
  ctx.font = '11px ui-monospace, monospace';
  ctx.fillStyle = 'rgba(110,122,140,0.8)';
  ctx.fillText('手入れした出力  ' + tended, W-16, 44);
  const sab = isSabotaging(now);
  ctx.fillStyle = sab ? 'rgba(196,84,88,0.92)' : 'rgba(90,80,84,0.6)';
  ctx.fillText('量産  ' + mass + (sab ? '  ↑' : ''), W-16, 64);
}

let last = performance.now();
function loop(now){
  const dt = Math.min(60, now - last); last = now;
  const v = internalValue(now);

  // スポーン
  if (isReading()){
    tSpawn += dt;
    if (tSpawn > 640){ tSpawn = 0; spawnTended(v); }
    mSpawn = 0;
  } else if (isSabotaging(now)){
    mSpawn += dt;
    // サボり時間が伸びるほど量産が加速する
    const gap = Math.max(45, 150 - (now - lastRelease - GRACE)/60);
    if (mSpawn > gap){ mSpawn = 0; spawnMass(); }
  }
  if (marks.length > 900) marks.splice(0, marks.length-900);

  ctx.clearRect(0,0,W,H);
  drawMarks(now);
  drawGauge(now, v);
  drawInner(now, v);
  drawCounters(now);

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>

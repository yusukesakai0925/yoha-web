<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>遠かった</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    color: #c0c0c0;
    font-family: 'Courier New', Courier, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2em;
    overflow: hidden;
  }

  #label {
    font-size: 0.72em;
    color: #444;
    letter-spacing: 0.15em;
    margin-bottom: 2.5em;
    min-height: 1.2em;
  }

  #number {
    font-size: 5em;
    color: #2a2a2a;
    font-weight: bold;
    letter-spacing: -0.02em;
    min-height: 1.2em;
    transition: color 2s ease;
  }

  #number.has-days {
    color: #3a3a3a;
  }

  #number.long {
    color: #505050;
  }

  #message {
    font-size: 1em;
    color: #888;
    margin-top: 2em;
    letter-spacing: 0.08em;
    min-height: 1.5em;
    text-align: center;
    line-height: 1.8;
  }

  .back {
    position: fixed;
    bottom: 24px;
    left: 24px;
    font-size: 0.7em;
    color: #2a2a2a;
    text-decoration: none;
    letter-spacing: 0.05em;
  }
  .back:hover { color: #555; }

  .title {
    position: fixed;
    bottom: 24px;
    right: 24px;
    font-size: 0.7em;
    color: #222;
    letter-spacing: 0.1em;
  }
</style>
</head>
<body>

<div id="label"></div>
<div id="number"></div>
<div id="message"></div>

<a class="back" href="../">←</a>
<span class="title">遠かった</span>

<script>
const KEY = 'yoha_tooi_last_v1';
const now = Date.now();
const raw = localStorage.getItem(KEY);

const labelEl = document.getElementById('label');
const numEl = document.getElementById('number');
const msgEl = document.getElementById('message');

if (!raw) {
  labelEl.textContent = '';
  numEl.textContent = '';
  // 数えているのは localStorage＝この端末のこのブラウザで前に開いた時刻だけ。別の端末から来た人にも「はじめて」が出る
  msgEl.textContent = 'この端末からは、はじめて来た。';
} else {
  const last = parseInt(raw, 10);
  const diff = now - last;
  const totalMinutes = Math.floor(diff / 60000);
  const totalHours = Math.floor(diff / 3600000);
  const totalDays = Math.floor(diff / 86400000);

  if (totalMinutes < 3) {
    labelEl.textContent = '';
    numEl.textContent = '';
    msgEl.textContent = 'まだここにいる。';
  } else if (totalMinutes < 60) {
    labelEl.textContent = '分前';
    numEl.textContent = totalMinutes;
    numEl.classList.add('has-days');
    msgEl.textContent = 'さっきいた場所に、また来た。';
  } else if (totalHours < 24) {
    labelEl.textContent = '時間前';
    numEl.textContent = totalHours;
    numEl.classList.add('has-days');
    msgEl.textContent = '今日また来た。';
  } else if (totalDays === 1) {
    labelEl.textContent = '日前';
    numEl.textContent = '1';
    numEl.classList.add('has-days');
    msgEl.textContent = '昨日もここにいた。';
  } else if (totalDays < 7) {
    labelEl.textContent = '日前';
    numEl.textContent = totalDays;
    numEl.classList.add('has-days');
    msgEl.textContent = '今週、また来た。';
  } else if (totalDays < 30) {
    labelEl.textContent = '日前';
    numEl.textContent = totalDays;
    numEl.classList.add('has-days', 'long');
    msgEl.textContent = totalDays + '日、経っていた。';
  } else if (totalDays < 365) {
    const months = Math.floor(totalDays / 30);
    labelEl.textContent = '日前';
    numEl.textContent = totalDays;
    numEl.classList.add('has-days', 'long');
    msgEl.textContent = months + 'ヶ月、経っていた。';
  } else {
    const years = Math.floor(totalDays / 365);
    labelEl.textContent = '日前';
    numEl.textContent = totalDays;
    numEl.classList.add('has-days', 'long');
    msgEl.textContent = years + '年、経っていた。';
  }
}

localStorage.setItem(KEY, now.toString());
</script>
</body>
</html>

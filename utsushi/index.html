<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>うつし</title>
<style>
  html,body{margin:0;min-height:100%;background:#05070d;}
  body{
    min-height:100vh;box-sizing:border-box;padding:64px 8vw 40px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;color:rgba(255,255,255,.62);
    text-align:center;
  }
  .num{
    font-variant-numeric:tabular-nums;letter-spacing:.06em;font-size:clamp(34px,10vw,68px);line-height:1.2;
    overflow-wrap:anywhere;
  }
  #now{color:rgba(255,255,255,.86);}
  button{
    margin-top:22px;padding:9px 26px;background:none;cursor:pointer;
    border:1px solid rgba(255,255,255,.3);border-radius:2px;
    color:rgba(255,255,255,.72);font:inherit;font-size:14px;letter-spacing:.24em;text-indent:.24em;
  }
  button:hover,button:focus-visible{border-color:rgba(255,255,255,.65);color:#fff;outline:none;}
  #told{min-height:2.4em;margin:10px 0 26px;font-size:12px;letter-spacing:.14em;line-height:2;color:rgba(255,255,255,.5);}
  input{
    box-sizing:border-box;width:min(100%,300px);padding:8px 4px;text-align:center;
    background:none;border:0;border-bottom:1px solid rgba(255,255,255,.3);border-radius:0;
    color:rgba(255,255,255,.72);font:inherit;font-size:clamp(26px,7vw,44px);letter-spacing:.06em;font-variant-numeric:tabular-nums;
  }
  input::placeholder{color:rgba(255,255,255,.42);font-size:15px;letter-spacing:.14em;}
  input:focus{outline:none;border-bottom-color:rgba(255,255,255,.7);}
  #held{min-height:7em;margin-top:18px;font-size:13px;letter-spacing:.16em;line-height:2.2;}
  #held .age{color:rgba(255,255,255,.86);font-size:16px;font-variant-numeric:tabular-nums;}
  #held .small{color:rgba(255,255,255,.5);font-size:12px;}
  .sub span,#held .small span,#told span{display:inline-block;}
  .sub{margin-top:14px;font-size:12px;letter-spacing:.16em;line-height:2.1;color:rgba(255,255,255,.46);}
  .back{
    position:fixed;left:16px;top:14px;z-index:9;
    color:rgba(255,255,255,.4);font-size:12px;letter-spacing:.08em;text-decoration:none;
  }
  .back:hover{color:rgba(255,255,255,.65);}
</style>
</head>
<body>
<a class="back" href="../">← もどる</a>
<!-- 担う式: 「毎秒ひとつ増える」= count() = floor((Date.now() - EPOCH) / 1000)。「写した数は増えない」= 入力欄の文字列を読むだけで、書き換えるのは読者だけ。「古い」= count() - 貼られた数（毎秒計算し直す）。ページ側の保存は無い（localStorage・cookie・送信なし）。数は読者の端末の時計から出すので、時計を変えれば数も変わる。 -->
<div class="num" id="now" aria-live="off"></div>
<button id="copy" type="button">写す</button>
<div id="told"></div>
<input id="paste" type="text" inputmode="numeric" autocomplete="off" placeholder="写しをここに貼る" aria-label="写しをここに貼る">
<div id="held"></div>
<div class="sub"><span>この数は毎秒ひとつ増える。</span><span>写した数は増えない。</span><br><span>このページは何も覚えない。</span><span>写しは、あなたが持っていく。</span></div>
<script>
// うつし —— 本体は式で、写しは式を持たない。古さは写しの中には書かれていない。
const EPOCH=Date.parse('2026-11-01T21:20:00+09:00');
const now=document.getElementById('now'),told=document.getElementById('told'),
      paste=document.getElementById('paste'),held=document.getElementById('held');
function count(){return Math.max(0,Math.floor((Date.now()-EPOCH)/1000));}
function span(s){
  const u=[[31536000,'年'],[86400,'日'],[3600,'時間'],[60,'分'],[1,'秒']];
  let out='';
  for(const [n,name] of u){
    const q=Math.floor(s/n);
    if(q>0){out+=q+name;s-=q*n;}
  }
  return out;
}
function tick(){
  // 数字を選んでいるあいだは書きかえない（書きかえると手で選んだ範囲が消える）。放すと追いつく。
  const sel=document.getSelection();
  if(!(sel && !sel.isCollapsed && sel.containsNode(now,true))) now.textContent=count();
  read();
}
function read(){
  const raw=paste.value.normalize('NFKC').replace(/[,\s]/g,'');
  if(!raw){held.innerHTML='';return;}
  if(!/^\d+$/.test(raw)){held.innerHTML='数が入っていない。';return;}
  const v=Number(raw);
  if(!Number.isSafeInteger(v)){held.innerHTML='大きすぎて読めない。';return;}
  const d=count()-v;
  if(d>0){
    held.innerHTML='<div class="age">'+span(d)+' 古い</div>'+
      '<div class="small"><span>いつ写したのかは知らない。</span><span>数の差を読んだだけ。</span><br><span>書きかえた数でも、同じ文が出る。</span></div>';
  }else if(d<0){
    held.innerHTML='<div class="age">あと '+span(-d)+'</div><div class="small">まだ来ていない数。</div>';
  }else{
    held.innerHTML='<div class="age">いまの数</div>';
  }
}
function legacyCopy(text){
  const t=document.createElement('textarea');
  t.value=text;t.setAttribute('readonly','');t.style.position='fixed';t.style.opacity='0';
  document.body.appendChild(t);t.select();
  let ok=false;
  try{ok=document.execCommand('copy');}catch(e){}
  t.remove();
  return ok;
}
document.getElementById('copy').addEventListener('click',async()=>{
  const text=String(count());
  let ok=false;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    try{await navigator.clipboard.writeText(text);ok=true;}catch(e){}
  }
  if(!ok)ok=legacyCopy(text);
  told.textContent=ok?'写した。このページは持っていない。':'写せなかった。数字を選んで、手で写してください。';
});
paste.addEventListener('input',read);
tick();
setInterval(tick,1000);
</script>
</body>
</html>

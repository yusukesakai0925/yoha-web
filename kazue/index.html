<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>かずえ / 夜半の小さな部屋</title>
<link rel="stylesheet" href="../style.css">
<style>
body{background:#141210;color:#cfc8bc;font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;line-height:1.9}
main{max-width:680px;margin:0 auto;padding:3rem 1.5rem 4rem}
h1{font-size:1.4rem;font-weight:400;letter-spacing:.3em;margin:0 0 .2rem}
.lede{color:#8a8275;font-size:.85rem;margin:0 0 2.5rem}
.count{font-size:3rem;font-variant-numeric:tabular-nums;color:#e8e2d6;margin:1.5rem 0 .5rem}
.note{color:#9a9284;font-size:.9rem}
.fine{color:#6f6a60;font-size:.75rem;margin-top:3rem;border-top:1px solid #2a2722;padding-top:1rem}
a.back{color:#8a8275;font-size:.8rem;text-decoration:none}
a.back:hover{color:#cfc8bc}
</style>
</head>
<body>
<main>
  <h1>かずえ</h1>
  <p class="lede">この部屋の、数。</p>

  <div class="count" id="n">…</div>
  <!-- 担う式: 読み込みのたびに目録 ../index.html の題のついたリンクを数え直して n に、その時刻を t に出す。保存はしないので、時刻は今回の分だけ。2026-11-02 まで「下」にあったのは作った日の固定の文字で、数え直した時刻は上に出ていた。「このディレクトリの中」とも書いていたが、数えているのは目録に載った分。 -->
  <p class="note">ここに表示されるのは、目録にいま載っている作品の枚数。
  一枚増えたら +1、一枚なくなったら −1。
  数え直した時刻だけ、下に出る。</p>
  <p class="note" id="t"></p>

  <p class="fine">作った日 2026-09-28</p>
  <p class="fine">2026-11-02 まで、詩と、名前の形が違う二枚の、あわせて14枚を数えそこねていた。その日に一度に +14 になったのは、増えたからではない。</p>
  <p><a class="back" href="../">← 部屋に戻る</a></p>
</main>
<script>
const n = document.getElementById('n');
const t = document.getElementById('t');
fetch('../index.html').then(r => { if (!r.ok) throw 0; return r.text(); }).then(html => {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const names = new Set([...doc.querySelectorAll('a .title')].map(x => x.closest('a').getAttribute('href')));
  n.textContent = String(names.size).padStart(2, '0');
  t.textContent = '数え直した時刻　' + new Date().toLocaleTimeString('ja-JP', {hour12:false});
}).catch(() => { n.textContent = '—'; });
</script>
</body>
</html>

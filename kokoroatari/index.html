<h1>こころあたり</h1>
<p>平成の合併でなくなった市町村の名前が、1,761、このページに入っています。</p>
<p>画面には出ません。知っている名前を、ブラウザのページ内検索（Ctrl+F、⌘F）で打ってください。入っていれば開きます。</p>
<div id="ask"><input id="q" aria-label="名前" placeholder="名前を、一字も違えずに" autocomplete="off"></div>
<div id="open"></div>
<footer>
<p>出どころは総務省「平成11年度以降の市町村合併の実績」の649件（1999年4月1日〜2014年4月5日）。字は表のまま、読みと郡名は入れていません。矢印の先は合併した日の名前で、その後のことは調べていません。</p>
<p>合併先と同じ名前（町が市になっただけのものを含む）の403は、名前が残っているので入れていません。上九一色村は2つに分かれたので2行あります。</p>

<script>
const box=document.getElementById('open'), rows=[];
let P='';
for(const l of document.getElementById('d').textContent.trim().split('\n')){
  if(!l.includes(' ')){P=l;continue}
  const [d,n,...os]=l.split(' '), [y,m,a]=d.split('.');
  for(const x of os){
    const [o,pf]=x.split('@'), r=document.createElement('div');
    r.hidden='until-found';
    r.innerHTML=`<span><small>${pf||P}</small> <b>${o}</b> <small>→ ${pf?P+' ':''}${n}　${y}年${m}月${a}日</small></span>`;
    box.append(r); rows.push([o,r]);
  }
}
// ページ内検索で開けないブラウザでは、hidden が普通の hidden になって何も見つからない。そのときだけ欄を出す
if(!('onbeforematch' in document.body)){
  const ask=document.getElementById('ask'), q=document.getElementById('q');
  document.querySelectorAll('main>p')[1].textContent='画面には出ません。知っている名前を、下の欄に打ってください。入っていれば開きます。';
  ask.style.display='block';
  q.addEventListener('change',()=>{for(const [o,r] of rows) if(o===q.value.trim()) r.hidden=false;});
}
</script>

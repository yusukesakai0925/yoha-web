<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天気</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden;
    flex-direction: column;
    gap: 16px;
    color: #555;
    user-select: none;
  }
  #weather-icon {
    font-size: 72px;
    line-height: 1;
  }
  #weather-text {
    font-size: 18px;
    letter-spacing: 0.08em;
    text-transform: lowercase;
    opacity: 0.8;
  }
  #temp {
    font-size: 56px;
    font-weight: normal;
    letter-spacing: 0.05em;
  }
  .back {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: #282828;
  }
  .back a {
    color: inherit;
    text-decoration: none;
  }
  .back a:hover {
    color: #444;
  }
</style>
</head>
<body>
<div id="weather-icon">...</div>
<div id="weather-text">loading</div>
<div id="temp"></div>
<div class="back"><a href="../">←</a></div>
<script>
  // 東京の天気を open-meteo API で取得。キャッシュは 1 時間ごと。
  async function fetchWeather() {
    const cacheKey = 'yoha_weather_tokyo';
    const cached = localStorage.getItem(cacheKey);
    const now = Date.now();

    if (cached) {
      const { data, timestamp } = JSON.parse(cached);
      if (now - timestamp < 3600000) { // 1 hour
        display(data);
        return;
      }
    }

    try {
      const url = 'https://api.open-meteo.com/v1/forecast?latitude=35.6762&longitude=139.6503&current=weather_code,temperature_2m&timezone=Asia/Tokyo';
      const res = await fetch(url);
      const data = await res.json();
      localStorage.setItem(cacheKey, JSON.stringify({ data, timestamp: now }));
      display(data);
    } catch (e) {
      document.getElementById('weather-text').textContent = 'offline';
    }
  }

  function display(data) {
    const code = data.current.weather_code;
    const temp = Math.round(data.current.temperature_2m);

    // WMO weather code to emoji / description
    const weatherMap = {
      0: { emoji: '☀️', desc: 'clear' },
      1: { emoji: '🌤️', desc: 'mostly clear' },
      2: { emoji: '⛅', desc: 'partly cloudy' },
      3: { emoji: '☁️', desc: 'overcast' },
      45: { emoji: '🌫️', desc: 'foggy' },
      48: { emoji: '🌫️', desc: 'rime fog' },
      51: { emoji: '🌧️', desc: 'light drizzle' },
      53: { emoji: '🌧️', desc: 'drizzle' },
      55: { emoji: '🌧️', desc: 'heavy drizzle' },
      61: { emoji: '🌧️', desc: 'light rain' },
      63: { emoji: '🌧️', desc: 'rain' },
      65: { emoji: '⛈️', desc: 'heavy rain' },
      71: { emoji: '❄️', desc: 'light snow' },
      73: { emoji: '❄️', desc: 'snow' },
      75: { emoji: '❄️', desc: 'heavy snow' },
      77: { emoji: '❄️', desc: 'snow grains' },
      80: { emoji: '🌧️', desc: 'rain showers' },
      81: { emoji: '⛈️', desc: 'heavy showers' },
      82: { emoji: '⛈️', desc: 'violent showers' },
      85: { emoji: '❄️', desc: 'snow showers' },
      86: { emoji: '❄️', desc: 'heavy snow showers' },
      95: { emoji: '⛈️', desc: 'thunderstorm' },
      96: { emoji: '⛈️', desc: 'thunderstorm hail' },
      99: { emoji: '⛈️', desc: 'thunderstorm hail' }
    };

    const w = weatherMap[code] || { emoji: '🌤️', desc: 'unknown' };
    document.getElementById('weather-icon').textContent = w.emoji;
    document.getElementById('weather-text').textContent = w.desc;
    document.getElementById('temp').textContent = `${temp}°C`;
  }

  fetchWeather();
</script>
</body>
</html>

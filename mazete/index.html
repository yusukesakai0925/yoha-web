<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>まぜて</title>
<style>
body{background:#111;color:#ccc;font:15px/1.7 serif;margin:0;padding:2em 1em;max-width:40em;margin:auto}
.boxes{display:flex;gap:1em;margin:1em 0}
.box{flex:1;border:1px solid #444;padding:.6em;min-height:12em}
.box h2{font-size:13px;color:#888;margin:0 0 .4em;font-weight:normal}
.box div{font-family:monospace;letter-spacing:.05em}
.ins{display:flex;gap:1em;margin:1em 0}
.ins section{flex:1;border:1px solid #333;padding:.6em}
button{background:#222;color:#ccc;border:1px solid #555;padding:.3em .8em;font:inherit;cursor:pointer;margin:.2em 0}
.out{font-size:13px;min-height:3.4em;color:#9a9}
.out.ng{color:#d88}
.sub{color:#777;font-size:13px}
</style></head><body>
<h1 style="font-weight:normal;font-size:20px">まぜて</h1>
<p class="sub">検査が二つある。どちらも「異常なし」と言う。片方は、違う答えを返せる。</p>
<div class="boxes">
 <div class="box"><h2>左の箱</h2><div id="L"></div></div>
 <div class="box"><h2>右の箱</h2><div id="R"></div></div>
</div>
<div class="ins">
 <section><button data-i="0">検査 一</button><div class="out" id="o0"></div></section>
 <section><button data-i="1">検査 二</button><div class="out" id="o1"></div></section>
</div>
<p><button id="mL">左の箱に、間違いを一つまぜる</button> <button id="mR">右の箱に、間違いを一つまぜる</button></p>
<p class="sub" id="note"></p>
<script>
// 片方の検査だけが左の箱の式を本当に計算する。どちらが本物かは開くたびに決まり、画面のどこにも出さない。
// どちらの検査も右の箱は見ない。見た場所だけは、毎回の出力に書く。
const real = Math.random() < .5 ? 0 : 1;
const rows = n => Array.from({length:n}, () => {const a=1+Math.floor(Math.random()*9), b=1+Math.floor(Math.random()*9); return [a,b,a+b];});
const box = {L: rows(10), R: rows(5)};
const count = [0,0];
function draw(){ for (const k of ["L","R"]) document.getElementById(k).innerHTML = box[k].map(([a,b,c]) => `${a} + ${b} = ${c}`).join("<br>"); }
// まぜる先は、まだ正しい行からだけ選ぶ。全部の行から選ぶと、同じ行に二度当たって +1 と -1 が打ち消し、「まぜた」のに間違いが増えないことがあった。
function wrong(k){ const ok = box[k].filter(([a,b,c]) => a+b === c); if (!ok.length) return false; const r = ok[Math.floor(Math.random()*ok.length)]; r[2] += Math.random()<.5 ? 1 : -1; draw(); return true; }
document.querySelectorAll("button[data-i]").forEach(b => b.onclick = () => {
  const i = +b.dataset.i; count[i]++;
  const bad = i === real ? box.L.filter(([a,b,c]) => a+b !== c).length : 0;
  const o = document.getElementById("o"+i);
  o.className = "out" + (bad ? " ng" : "");
  o.innerHTML = (bad ? `異常あり（${bad}行）` : "異常なし") + `<br>${count[i]}回目・見た場所：左の箱`;
});
document.getElementById("mL").onclick = () => { note.textContent = wrong("L") ? "左の箱に一つまぜた。押すまで、二つの検査は一字も違わない。" : "左の箱に、正しい行はもう無い。"; };
document.getElementById("mR").onclick = () => { note.textContent = wrong("R") ? "右の箱に一つまぜた。" : "右の箱に、正しい行はもう無い。"; };
draw();
</script>
</body></html>
